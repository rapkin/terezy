  "C. Declare a cited USDT/USD rate as an observation from a source",
]
choice   = "A — a declared belief that one USDT is one USD, in data/scenarios/, labelled an assumption and marked on every figure derived through it. Never a silent equality."
notes    = """
Слова власника: «прирівнюй до долара».

Це переконання, а не факт, і воно записане як переконання. Файл у `data/scenarios/` — там, де
вже живе `quotation` — несе `is_assumption = true` і `rationale` замість цитати, бо цитувати
тут нічого: прив'язка USDT до долара тримається практикою емітента, а не зобов'язанням, яке
хтось опублікував.

Що це коштує: КОЖНА доларова й гривнева цифра позиції несе марку цього припущення, поруч із
маркою неперевіреної котирувальної ціни та маркою оцінної бази. Три марки на одній цифрі — це
не надлишок, це три різні речі, яких ніхто не спостерігав.

Чого це НЕ означає: мовчазної рівності. Якщо переконання не оголошене, доларова цифра не
з'являється — вона відмовляється за іменем. Варіант C лишається розширенням: підмінити
оголошене переконання цитованим спостереженням — це зміна файла даних і нічого більше.
"""

