feature = "013-enumerated-schedule"
title   = "Звідки перелічена форма бере часову вісь"
choice  = "Оголошувати день рахунку"
notes   = """
FR-018 стверджувала, що річна ставка не потребує жодного породжувального терміну. Це
напівправда: дати випуску вона справді не потребує, але `project.py` будує частки року з
`terms.day_count`, а `hurdle.py` прямо забороняє зашитий 365, бо ставка розійшлася б із
графіком, з якого її пораховано.

Рішення: перелічена форма несе власне поле дня рахунку. Аргумент — це конвенція
ОБЧИСЛЕННЯ, а не термін випуску: вона не описує папір, вона описує, як ми рахуємо. FR-003
забороняє породжувальні терміни, і це не він.

Ризик, який треба закрити в тексті: поле виглядає породжувальним, і хтось спробує вивести
з нього графік. FR-003 має сказати, що воно не є входом до жодного виведення сум.
"""

[[answer]]
q       = 2
feature = "013-enumerated-schedule"
title   = "Два місця, які читають породжувальні поля напряму"
choice  = "Питати декларацію"
notes   = """
`core/ledger/seeds.py:342` читає `terms.issue_date`, щоб відмовити відкривальному лоту;
`core/decision/tuple_outcome.py:1599` читає `terms.day_count` і вже розгалужується за типом
декларації. FR-011 казала, що ці шари лишаються незмінними — хибно для обох.

Рішення: обидва місця питають декларацію, а не читають поле. Ключове спостереження, яке
робить це делегуванням, а не розгалуженням: `seeds.py` ніколи не потребував ДАТИ ВИПУСКУ —
він потребував найранішої дати, з якої умови паперу відомі. Обидві форми на це
відповідають, просто по-різному.

FR-011 треба переписати з «шар не змінюється» на «шар не розгалужується за формою», бо
перше хибне, а друге і є тим, що ця фіча має гарантувати.
"""

[[answer]]
q       = 3
feature = "013-enumerated-schedule"
title   = "Випуск UA4000235865: тіло раніше купона, список не за датами"
choice  = "Впорядковувати при транскрипції"
notes   = """
Єдиний реальний контрприклад із 32 — і він же єдиний папір, який форма, як специфікована,
відхилила б при завантаженні. Це збіг, що варто назвати: хибний вимір («два платежі на одну
дату в усіх 32») ховав рівно той випуск, який має значення.

Рішення: порядок встановлюється при транскрипції, там же, де копійки переводяться в гривні.
Транскрипція вже є оголошеною людською дією, і впорядкування — її частина.

Що має бути в тексті: транскрипція ЗАПИСУЄ, що джерело подало інакше. Інакше ми втрачаємо
як факт те, що видавець публікує тіло перед останнім купоном — а це спостереження про
джерело, не про гроші. FR-006 лишається як є: завантажувач відмовляє невпорядкованому
списку і НЕ сортує сам.
"""

