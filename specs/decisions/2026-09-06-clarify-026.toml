# Owner answers — the two clarifications of 026's specification.
#
# Взято 2026-09-06, по одному питанню за раз. Q1 називає закритий словник, який ще не існує.
# Q2 не обрало ЖОДНОГО з трьох варіантів: власник відповів фактом про свій рахунок, і цей
# факт робить питання не про рендеринг, а про рушій.
#
# `choice` несе САМУ ВІДПОВІДЬ, а не лише літеру варіанта. Де варіант є, він названий на
# початку рядка; для Q2 літери немає, бо жодна не описує відповідь.
exported_on = "2026-09-06"

[[answer]]
q        = 1
feature  = "026-answer-screen"
title    = "Чи оголошується вид місця в даних, і яким словником"
question = "Is the venue `kind` vocabulary the owner's to name, and does every shipped venue get one?"
options  = [
  "A. The five of the mockup — bank, exchange, broker, platform, payroll — and he assigns each shipped venue its kind",
  "B. A different set he names",
  "C. No venue kind; one neutral hue for every venue",
]
choice   = "A — the five, closed, declared in `core/`; an unknown kind refuses at load; every shipped venue carries one."
notes    = """
Словник: `bank`, `exchange`, `broker`, `platform`, `payroll`. Закритий, у `core/`, невідомий
вид відмовляє НА ЗАВАНТАЖЕННІ з назвою файлу й поля — як кожне інше закрите поле. Жодне місце
не лишається без виду.

Власник назвав шість із дев'яти. Решту три призначено за очевидним читанням і виписано тут
саме для того, щоб він міг виправити рядок, а не шукати його в дифі:

| venue | kind | від кого |
|---|---|---|
| `monobank_uah` | `bank` | власник |
| `binance` | `exchange` | власник |
| `coinbase` | `exchange` | власник |
| `ibkr_usd` | `broker` | власник |
| `inzhur` | `platform` | власник |
| `deel` | `payroll` | власник |
| `fop` | `bank` | призначено — ФОП-рахунок відкритий у банку, обидві валютні сторони на одному місці |
| `payoneer` | `platform` | призначено — ДПС називає її «небанківською установою», тож `bank` була б хибною; з п'яти лишається `platform` |
| `foreign_bank_usd` | `bank` | призначено — категорія «рахунок, відкритий у іноземному банку» |

`payoneer` — єдине призначення, де п'ять слів не мають точного: платіжна система не є ані
фондовою платформою, ані банком. `platform` обрано тому, що `bank` суперечила б цитованому
джерелу в `data/tax/destinations/ua.toml`, а вигадати шосте слово означало б розширити словник
під один рядок.

Екран відповіді не малює жодного місця — це видно з OB-15. Тобто зміна оплачується мовою, а не
цим екраном, і саме тому вона стоїть останньою фазою.
"""

[[answer]]
q        = 2
feature  = "026-answer-screen"
title    = "Що картка називає «гроші назад»"
question = "What does a card call *money back* — one figure summing what arrives and the undeployed remainder, two figures each labelled by where it is, or what arrives alone?"
options  = [
  "A. One figure: what arrives plus the undeployed remainder, with the split on expansion",
  "B. Two figures, each labelled by where it is",
  "C. What arrives alone, remainder on expansion",
]
choice   = "None of the three — the premise is wrong. The remainder comes home too: it rides the declared exit route to a spendable endpoint, so *money back* is ONE figure, `reaches`, served that way by the engine."
notes    = """
Слова власника, 2026-09-06:

> насправді оці лишні гроші з брокерського рахунку можна вивести назад без комісій та
> податків. дивно що це не працює

Три варіанти питання всі припускали, що залишок ЛИШАЄТЬСЯ на місці купівлі. Це припущення
хибне для його рахунку, і воно було рушієвим, а не рендеринговим: `reaches` вимірювався на
розгорнутій частині, а залишок був окремим полем, якого ніщо не повертало додому.

Тобто виправляється рушій, а не картка. Залишок їде оголошеним маршрутом виходу — тим самим,
яким їде решта, — і стає частиною `reaches`; його прибуття рахується у «всі гроші назад на».
Це окрема гілка `fix/undeployed-remainder`, яка пише власне рішення
`specs/decisions/2026-09-06-undeployed-remainder-returns.toml` — на день цього запису того
файлу ще немає.

Скільки цей маршрут БЕРЕ із залишку — питання тієї гілки, а не цього запису. Власник говорить
про свій рахунок, і його слова є свідченням про його рахунок; комісія, яку модель нарахує,
приходить з оголошеного маршруту з цитатою, а не з цієї відповіді.

Наслідок для 026, і він менший, ніж будь-який з трьох варіантів: «гроші назад» — ОДНА цифра,
яку подає API, і клієнт нічого не додає й нічого не віднімає. На розкритті картка показує
ПОДАНИЙ запис `UndeployedCash` поруч із цією цифрою; розгорнуту частину вона не рахує, бо
`reaches` мінус залишок — це цифра, якої API не давав, тобто рівно те, що забороняє FR-008.
Випадок, коли залишок ДОДОМУ НЕ ПОТРАПИВ — інша валюта, курс тут не питають ніде, — має бути
на записі як вердикт, інакше заголовок знову тихо занижує суму. Це друга обов'язковість, яку
гілка виправлення несе (OB-13).

Порядок: виправлення рушія має приземлитися ПЕРШИМ. Поки воно не на `main`, `reaches` ще не
містить залишку, і картка, яка малює одну цифру, малювала б неповну. У `features.toml` це не
записується як `needs` — там стоять фічі, а не гілки виправлень — тож умова стоїть у заголовку
специфікації та в нотатці запису.
"""
