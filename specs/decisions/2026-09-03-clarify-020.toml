# Owner answers — the three open clarifications of 020's specification.
#
# Written before planning, so that the plan is built on the answers rather than on the
# defaults the spec shipped while they stood open.
exported_on = "2026-09-03"

[[answer]]
q       = 1
feature = "020-http-api"
title   = "На якому курсі HTTP-шар має перераховувати суми для показу"
choice  = "Відкласти перемикач цілком"
notes   = """
Питання пропонувало три варіанти: (A) курс оголошеного каналу — його `reference_rate`;
(B) не перераховувати нічого, а відмовляти блоку показу поіменно; (C) оголосити четверту
роль курсу — презентаційну — з власною директорією і власними цитатами.

Відповідь власника: «відкладемо перемикач курсів поки». Це не вибір B: B лишав у схемі
параметр `display` і блок, що відмовляє, а рішення прибирає і те, і те. Ця фіча не має
параметра показу, не має блоку показу і не викликає `money.convert` жодного разу — кожна
сума віддається у власній оголошеній валюті.

Наслідок, який треба назвати вголос: рядок F2 у `docs/REQUIRED_TESTS.md` лишається
відкритим, і його примітка тепер справджується буквально — половину про порядок і
реалізовані суми не можна закрити фічею, яка перемикача не має. FR-021 — FR-025 не
видалені: вони переміщені під заголовок «Deferred by owner decision» як запис того, що
пропонувалося.
"""

[[answer]]
q       = 2
feature = "020-http-api"
title   = "Чи має `as_of` значення за замовчуванням"
choice  = "Обовʼязковий, без замовчування"
notes   = """
Варіант A специфікації, підтверджений. Запит без `as_of` відмовляє, називаючи параметр.
Жоден шлях у цій фічі не читає годинник, тож два запити на ту саму адресу через тиждень
дають ту саму відповідь. Ціна — вебклієнт мусить сам вирішити, яку дату він має на увазі,
і показати її; це та ціна, яку 015 FR-006 уже заплатила на дієслові.
"""

[[answer]]
q       = 3
feature = "020-http-api"
title   = "Девʼять відмов, які не несуть поля `reason`"
choice  = "Позначити поле необовʼязковим, ядро не чіпати"
notes   = """
Варіант A специфікації, підтверджений. Схема позначає `reason` необовʼязковим, а тест
ЗНАХОДИТЬ безпричинні записи обходом типів відповіді і порівнює знайдену множину з
переліком, який лежить поруч із тестом, — тож десята така відмова є свідомою правкою, а не
тихим розширенням. Варіант B (дописати `reason` у девʼять записів ядра) лишається кращою
довгостроковою відповіддю і належить фічі про словник відповіді, а не про її серіалізацію;
варіант C (синтезувати причину в HTTP-шарі) закритий у самій специфікації.
"""
