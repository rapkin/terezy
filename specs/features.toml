[[future]]
id    = "late-payment-interest"
after = ["009-tax-depth"]
note  = "paying a tax liability late under statutory interest, as an alternative to selling. Offered to the owner on 2026-08-22 and NOT taken (009 FR-011); recorded so the deferral is a decision rather than a gap"

[[future]]
id    = "fx-tax-asymmetry-f1"
after = ["002-ramp-cost"]
note  = "flat-in-USD posts taxable UAH gain. 011 supplied the dated official rates; what remains is the POSITION, and it is two things rather than one. `core.results.project` folds a holding under a single currency and sums every charge in it, so a hryvnia charge inside a dollar projection is a currency mismatch before any rate is consulted. And a realised gain is not an amount on a date: it needs a per-lot basis carried in both currencies with each leg struck at its own date's official rate. 011 refuses the gain by name rather than converting it at the disposal date's rate, because that arithmetic reports zero hryvnia for a position flat in dollars and would make F1 unfalsifiable (core.tax.year.ForeignGainNotStruckPerDate). Narrowed 2026-08-29 while implementing 011."

[[future]]
id    = "declared-working-day-calendar"
after = ["011-official-rate"]
note  = "011 FR-011 lets a rate series declare a cited non-publication-day rule and forbids the engine from knowing what a weekend is. The Ukrainian rule -- пункт 10 розділу III of the Положення that Постанова Правління НБУ від 10.12.2019 № 148 approves -- is written entirely in working days, pre-holiday days, weekends and holidays, and пункт 11 adds the Cabinet's power to move working days. So it cannot be declared without a DECLARED, CITED working-day and holiday calendar: a new kind of declaration with its own jurisdiction, provenance and amendment history -- a feature, not a data entry. The calendar-free encoding 'latest observation on or before the event date' is refused by 011 itself, since it cannot distinguish a weekend from a gap in the series. What CAN be declared without a calendar is an explicitly enumerated per-date mapping, which is what 011 SC-015 exercises. Until this lands, 011 FR-017 ships the Ukrainian series with no rule and every non-publication date refuses. The quotation, the amendment markers and which абзаци are № 148's own words are in 011's owner verification task 1 and are deliberately not copied here -- the copy that was here collapsed a distinction the task gets right. Recorded 2026-08-25 during the 011/012 review; deliberately not built."

[[future]]
id    = "crediting-destination-verdicts"
after = ["012-fop-group-3"]
note  = "The crediting-destination verdicts in 012 are the least settled thing in that feature and are EXPECTED TO MOVE. They rest on administrative positions rather than statute -- practitioner reports of ДПС consultations, and consultations that bind only the taxpayer who asked for them (п. 52.2 ст. 52 ПКУ). Three moved during specification (2026-08-25 to 08-27), each time because a better source turned up rather than because the reasoning changed, which is the shape of a question that does not close by searching. What closes one is an індивідуальна податкова консультація of the owner's own -- 012 owner verification task 6 -- and that is his action, not a research task. Moving one is cheap by design: a verdict is declared data behind 012's normative table, not a branch in the engine, so a change is a row in the table, a row in the verdict register beside it, and a line in task 6 -- never a redesign and never a source-code change. Build for the verdicts moving rather than for these particular ones being right. Recorded 2026-08-27 on the owner's instruction to stop retrieving and record instead."

