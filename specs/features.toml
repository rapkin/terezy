[[feature]]
id     = "011-official-rate"
status = "done"
needs  = ["002-ramp-cost"]
why    = "the tax-currency role (Principle VI) has never had machinery: 011's per-kind staleness threshold follows 002's FR-028 and lands in the same `data/observation_kinds.toml`, and 011's central prohibition — the official rate never prices a leg, a channel rate never strikes a tax base — is the rule 002 already wrote at `core/routes/legs.py::channel_for` and `data/declarations/resolver.py::_check_channel`, which 011 must leave standing"
note   = "no open clarifications. One owner verification task -- the clause naming which official rate governs a day the NBU does not set one -- and FR-017 ships its refusal live, so the gap is in the output rather than only in prose. Declaring the rule is NOT a data-only change: it is written in working days and public holidays, so it needs the 017-working-day-calendar feature -- which is what the declared-working-day-calendar future entry became when 017 was specified on 2026-08-30 (FR-018). The citation, the retrieval record and what the paraphrase lost are in the spec's owner verification task 1; nothing is repeated here."

[[feature]]
id     = "012-fop-group-3"
status = "done"
needs  = ["002-ramp-cost", "006-inzhur-instruments", "011-official-rate"]
why    = "006 for dated rate schedules (E10) — the regime's levy commences on a date a second law set, a month after the date its own law named — and for the precedent of a declaration naming tax classes instead of carrying a rate; 011 because the base is the credited foreign amount at the official rate on the CREDIT date, a different number from the hryvnia the compulsory sale produces; 002 because the scalar `IncomeStream.income_tax_rate` that 012 retires is 002's FR-007, and the deployable-capacity types whose undeclared-is-not-zero behaviour must survive the migration are 002's"
note   = "no open clarifications. Six owner verification tasks, two load-bearing; every legal value is cited to a primary text and carries an empty verified_on. **What the verdicts are for each crediting destination, and the two criteria that assign them, are stated once in the spec under 'Legal grounding' and applied there in a table. Do not restate them here** -- this note carried a copy through three review rounds and the copy is what went stale each time. The verdicts now also live as DATA, in data/tax/destinations/ua.toml, one row per (scheme x venue) with its recorded judgement -- so moving one is that row plus the register beside the spec's table plus a line in owner verification task 6, and never a source change (tests/contract/test_scheme_data_only.py asserts it). Two findings the implementation reported: FR-027 names three refusal states and the engine can produce two, because *no source reaches this destination* and *a source reaches it and the table has not caught one* are one observation to a program (research D16); and deployable capacity had to move to its own module, because it is net of a charge struck at an official rate while core.routes imports the stream module, and official-rate-never-prices-a-leg forbids that reach even through two hops."

[[feature]]
id     = "013-enumerated-schedule"
status = "done"
needs  = ["009-tax-depth", "010-full-tuple"]
why    = "010 because the feature's central success criterion is a full-tuple comparison -- an enumerated and a generative declaration with the same cash flows must produce identical figures and the same ranking position, which is only assertable once the join exists; 009 because a secondary-market purchase realises a premium or discount at redemption (31 of the 32 observed issues quote above face), and whether that loss may reduce another base is a question about 009's per-category netting and carryforward. Transitively covers 001 (the generative form this one sits beside), 002 and 006 (the two-differently-taxed-classes fixture FR-010 requires)."
note   = "No open clarifications. One was drafted on 2026-08-24 -- the tax character of the premium a secondary-market OVDP is bought at -- and WITHDRAWN the same day, because the answer was already declared and cited in data/tax/timing/ua.toml. **Do not restate that declaration here.** The withdrawal, what the draft had failed to read, and why the question decides no reachable figure are in the spec under \"The premium, and why it is not a clarification\"; the provision and the category fields are in the data file, which is the thing that changes if the law does. The note directly above this one records what a third copy costs. What survives the withdrawal is 013 FR-026, and the first review corrected it: the netting case is not hypothetical, because FR-010's mandated fixture reaches it inside this feature, so it is asserted rather than warned about. Three blocking findings answered 2026-08-27 in specs/decisions/2026-08-27-clarify-013.toml -- the enumerated form carries a day count, the sites that read a generative field ask the declaration instead, and payment order is settled at transcription."

[[feature]]
id     = "014-candidates"
status = "done"
needs  = ["004-composed-paths", "010-full-tuple"]
why    = "010 because the whole of this feature's pruning is 010's seventeen typed refusals and its evaluation is 010's `evaluate` -- FR-006 forbids a feasibility rule of its own, so without 010 there is nothing to prune with and nothing to prune; 004 because the two route terms of every candidate are chains `compose` emits, and this feature MUST NOT decide that two routes join (FR-002). Transitively covers 003 (the spendable list `compose` needs, and the `EXIT_BY_IDENTITY` resolution), 002 and 006. NOT 011, 012 or 013: each changes which candidates drop or how many instruments exist, and neither is a thing the loop has to know."
note   = "No open clarifications. Three were drafted and closed against precedent rather than sent to the owner -- the candidate ceiling's shape (004's segment bound settles it), the cross-currency amount (refuse the conversion, take an amount per stream), and the zero-hop way in (a recorded gap, unreachable in the shipped registry). **The reasoning is in the spec under 'Questions that were drafted and closed'; do not restate it here.** **The measured registry counts are in the spec under 'The measurement' and are reproducible by loading `data/`; do not restate them here** -- the note two entries above records what a third copy of a count costs, and a count in a note beside the file that produces it is the same shape. What the spec's measurement establishes and this graph needs: the shipped registry yields candidates from one stream only, and the cause is a direction the routes are declared in rather than a corridor nobody declared -- 003's audit to answer, not this feature's to fix. Two pieces of work sit OUTSIDE this feature's module and are required by it: a declaration kind for the candidate ceiling, and widening 004's `CompositionRefused` to say which of its three cases fired (spec FR-014a), without which FR-014 and FR-018 are implementable only by string-matching a reason field."

[[feature]]
id     = "015-the-question"
status = "done"
needs  = ["010-full-tuple", "014-candidates"]
why    = "014 because the question's answer IS an enumeration handed to `compare`, and without it there is nothing to answer with; 010 because every figure in the answer and every refusal in it is 010's. Transitively covers 003, 004, 002 and 006."
note   = "The vertical slice, and the first feature whose deliverable is user-facing. A QUESTION IS A DECLARATION -- owner decision 2026-08-30, taken against a command-line-arguments-are-canonical alternative: a question in `data/questions/*.toml` is diffable, citable, reproducible from an artefact, and drops into the golden machinery that already digests declaration files, while a new kind of question is a schema field rather than a CLI option plus an API parameter. Flags remain as sugar that builds the same record in memory. The API is ONE verb -- `answer(question, registries, as_of)`. **The answer must be able to refuse in parts.** When it landed the official-rate series was empty, four of five crediting verdicts were unsettled, and seven of nine instruments were fixtures; an answer that returns a number for those has lied. 016 then declared 24 real ОВДП issues, so the fixture share is the smaller half of the registry -- and the deliverable is unchanged, because what makes an answer honest is naming each gap rather than having none. Naming each gap in the output is the deliverable, not a fallback. Owner decision D-B keeps the web framework unchosen until the result schema has stabilised against real output -- this feature is what stabilises it. **The one clarification is ANSWERED (owner, 2026-08-30) and encoded**: a horizon window means the money comes out at its end, and selling early is normal. The draft had claimed the mid-life disposal price was missing and that was WRONG -- `data/observations/inzhur.toml` publishes a buy and a sell for every active issue, and an exit route already carries a latency. What is missing is an ASSUMPTION, not a price: the observed spread taken to hold at a future date, declared, marked and propagating (015 FR-032). A REVIEW ON 2026-08-30 found five contradictions between requirements of the spec itself and reopened it; all are fixed and the question it raised is ANSWERED (owner, same day): A SUBJECT IS AN INSTRUMENT ID OR A DECLARED GROUP, because the owner asks in groups and none of his four words is an id. 016 settles it beyond taste -- it declares 24 real OVDP issues, so an ids-only question file grows to 33 entries and needs a hand edit per issue thereafter, silently wrong until somebody makes it, while a group takes new issues by label and the question file does not change. The alternatives and the three inference traps a group must not fall into are in the spec; do not restate them here. This costs a declaration kind and LABELS ON THE SHIPPED INSTRUMENTS -- without them the owner's question resolves `ovdp` and `inzhur` to nothing and the feature cannot demonstrate itself. And it moves the headline count, because a subject reaches what its LABEL reaches and not what the registry declares -- an instrument in neither group is reached by neither word, which `tests/contract/test_group_membership_is_declared.py` plants and asserts. On the registry as it shipped in 015 that made the difference between seven ids and nine; on the shipped registry today the two coincide, because since the owner's rule of 2026-09-02 nothing ships outside his two families. The count is derived per run and stated in no prose here. What the review also settled: an answer's exclusions are TYPED RECORDS and not the `frozenset[str]` of composed sentences `TupleOutcome.excludes` uses, so the scan keeping a headline out of the UI's contract stays whole; a section reports NO evaluated candidate rather than a labelled figure whose money arrives after `horizon.end`, which needs no change to 010's union; and the owner may STATE an exchange rate on a run plan, without which `inzhur_reit` -- one of the two real declarations in the registry -- refuses for ever. Required changes in feature 010, named there rather than re-decided: `CannotSpanHorizon`'s BOND arm is falsified by the answer -- its own words are that the money could not have been withdrawn, and it can be, at a spread -- while its FUND arm survives ONLY UNDER `liquidity_mode = \"legal\"`, which is the review's correction: the arm fires on `exit_line is None`, a fact about the PLAN rather than about what the fund owes, and practice mode IS the assumption that the buyback happens. Plus a home for the missing-resale-price refusal, which may need no widening at all if 016 declares the price on the access record. **The measured state of the shipped registry is in the spec under 'The measurement' and is reproducible by loading `data/`; do not restate it here** -- the 014 note above records what a second copy of a count costs. Four owner verification tasks, three of them declarations that do not exist: cash, BTC, and a real-terms rate for a tuple, which turns out to exist on 001's hurdle and nowhere in `TupleOutcome`. FOUR pieces of work sit OUTSIDE this feature's module and are required by it -- the spec's Assumptions list them and the first draft said 'two ... and nothing else', which was false: the declared subject set on 014's `Question`; the two 010 changes above; `data/questions/` named in the provenance gate's fail-closed exemptions with its reason; and rebuilding `terezy.data.manifest`, which is the one a plan will miss -- `RunManifest` is single-projection shaped with no `as_of` and no `regime`, and `InputKind` is a closed five-member `Literal` with no member for a question, a route, an access declaration, a stream, a spendable endpoint, a composition set or a tax destination."

[[feature]]
id     = "016-real-ovdp"
status = "done"
needs  = ["013-enumerated-schedule", "006-inzhur-instruments"]
why    = "013 because a real OVDP's schedule cannot be derived from a rate and a period -- the enumerated form is what makes these declarable at all; 006 for the access and venue-terms precedent these are reached through."
note   = "Owner instruction 2026-08-30: the reality of the data comes before any claim about the data. Seven of nine shipped instruments are fixtures and 732 declared values carry an empty `verified_on`. The 32 issues are ALREADY RETRIEVED, in `data/observations/inzhur.toml` with their payment schedules, source and retrieval date -- this feature turns observations into declarations, which is judgement a fetcher may not make. **Retrieval is not verification**: these are a seller's published quotations, and what `verified_on` may be filled from is part of what this feature must settle. Spec written 2026-08-30; THREE CLARIFICATIONS OPEN, so planning may not start. They are stated once in the spec under 'Clarifications', with options and a recommendation each -- do not restate them here. What the spec establishes and this graph needs: the answer to the verified_on question is that NOTHING this feature declares may carry a verification date, and the quotation's can never be filled by anyone, so every figure from a real OVDP stays marked for ever and verification removes the REASONS for the mark rather than the mark. Two pieces of shipped machinery make an honest declaration unrepresentable and are requirements rather than prose: the provenance gate refuses a verification date on any enumerated schedule, and the closed four-member inference set cannot record that the CURRENCY is inferred -- the endpoint states none, the fetcher reads none, and the OVDP programme issues in more than one. The registry goes from 9 instruments to 33, which moves 014's 18 pairs and 9 candidates and the candidate golden; the sites are enumerated in the spec under 'Counts that move'. REVISED the same day, after a PRIMARY SOURCE for the terms was found and probed -- the NBU depository for government securities, `bank.gov.ua/depo_securities?json&date=`, 195 issues and 3634 payment rows, MinFin named as issuer on every one. It states the currency, the nominal, the payment kinds and the whole schedule, so 013's four inferences become retrieved facts and the terms become VERIFIABLE; the quotation still is not, and is now the single remaining reason for the mark. The cross-check found two errors in the seller's data -- one wrong date in UA4000235782, and UA4000235865's principal published a day early and out of order, which is 013 FR-020a's motivating real instance and turns out to be a mistake rather than issuer behaviour. ALL THREE QUESTIONS SETTLED BY THE OWNER 2026-08-30 and the spec is ready for planning: 016 STAYS DATA-ONLY, the quotation's verification date gets no rule and no test, and no new staleness kind is opened. The cost of data-only is stated once in the spec at FR-011 -- the gate forces 24 citations to call the issuer's published schedule an inference -- with the minimal alternative specified beside it and recorded below as a future. The measurements, the two corrected claims and the withdrawn currency inference are in the spec; do not restate them here."

[[feature]]
id     = "017-working-day-calendar"
status = "done"
needs  = ["011-official-rate"]
why    = "011 declared the non-publication rule and proved it cannot be evaluated: the NBU rule is written in working days, pre-holiday days and public holidays, and `core.tax.official_rate` contains no notion of a weekend, a holiday or a banking calendar (011 FR-011). This feature is that missing declaration kind."
note   = "SPEC LANDED 2026-08-30, AND THIS FEATURE BLOCKS NOTHING. The premise that made it urgent was that a rate series has gaps; it does not. The NBU publishes for EVERY CALENDAR DAY -- Sat 2026-08-29 and Sun 2026-08-30 both 44.5445, Mon 44.5505, and 1 January 2026, a public holiday, 42.3532 -- so 018 was released from needing a calendar, and the carry-forward rule the owner declared in its place («є курс на неділю — супер, а як нема то бери останній робочий курс») needs none while the series covers every day. A calendar becomes necessary only if a series ever has gaps. THREE consumers, not two -- the first draft of the spec missed the one that moves money. `instruments/fixed_income.py:138/:521/:794` moves COUPON AND MATURITY DATES through the declared business-day registry, and the only two declarations naming a rule are `is_synthetic = true` fixtures the engine already marks, while every other bond is 013's enumerated form and needs no calendar -- so nothing read as correct moves through it, and the exposure is the first REAL bond declared in the generative form; that one is blocked on nothing but the calendar. The other two are each blocked on something else: fund settlement needs a VENUE calendar nobody retrieved, and tax due dates move nothing while `data/tax/timing/ua.toml` declares `non_business_day_rule = \"none\"` on all three categories because the legal rule was never researched. So it is unscheduled rather than urgent because placing a coupon on a holiday is a STATED, VISIBLE wrongness (`conventions.py:196` says so in its own docstring), and because the live consumer first needs an answer this feature deliberately does not give: whether a coupon date takes a jurisdiction's CIVIL calendar or the SETTLEMENT calendar of the venue that pays it -- a question only an issue's own terms settle, and one FR-003's scope field is what makes askable. **ENUMERATED, NOT GENERATIVE**, and 013's both-forms precedent was read and deliberately not followed: a generative form would put a Paschalion in the engine, could not express the annual Cabinet act that moves working days, and would key the martial-law holiday suspension to a belief the system already holds in two places without knowing it -- while an enumerated calendar with a declared two-ended window conditions on nothing, stops, and refuses. A REFUSAL IS NOT A BELIEF. The scope decision (a jurisdiction's civil calendar; `settlement` reserved; observed publication days refused a member outright) and the argument are in the spec and are deliberately not copied here. CL-1 CLOSED 2026-08-30, record and defer: the uncited weekend at `core/primitives/conventions.py:196` and its three consumers stay, because rewiring the fund half would point a CIVIL calendar at a SETTLEMENT question -- the conflation the scope field exists to prevent. Two owner verification tasks stay open, including a RECORDED FAILED RETRIEVAL of КЗпП статті 53/67/73 so nobody repeats it blind. LIVE HOLE IN A BLOCKING GATE, found by this spec's source reading and worth more than this feature's schedule: `scripts/check_provenance.py:270-272` decides a table needs a citation by counting NUMERIC leaves and `check_table:416` gates BOTH the citation loop AND `_check_kind_field` behind it, so a calendar row -- a date and a label, no number -- would pass UNCITED AND WITH AN UNVALIDATED KIND even with the directory listed in SOURCED_DIRS. Independent of calendars and being fixed ahead of this feature, with the delta over the gate's full finding set measured because the predicate is shared by all eight SOURCED_DIRS (spec FR-006, FR-006a, FR-006b). FR-018's scan lands ahead of it too, against the corrected three-site set."

[[feature]]
id     = "018-nbu-rate-series"
status = "done"
needs  = ["011-official-rate"]
why    = "011 built the series, its refusals and the tax-currency role and shipped them empty; this is the data they have never had. NOT 017: that dependency assumed the series has gaps a working-day rule must reason about, and it has none -- the evidence and what would restore the dependency are in the note."
note   = "spec.md 2026-08-30; no open clarifications, three owner verification tasks, none blocking. **`needs` NARROWED from 017 on 2026-08-30** after two independent retrievals settled the publication question: the NBU returns a rate for EVERY CALENDAR DAY, dated that day (366 rows/366 days in 2024; 1703/1703 over 2022-01-01..2026-08-30, zero missing; confirmed per-date for Sat 2026-08-29, Sun 2026-08-30, the day-ahead Mon 2026-08-31 and the holiday 2026-01-01, all retrieved 2026-08-30). Weekends CARRY the preceding working day's rate; HOLIDAYS FREQUENTLY DO NOT -- the review measured 18 of 43 fixed-date holidays in 2022-01-01..2026-08-30 where the published rate differs from the last working day's, three of them 1 January and three 25 December, so the last-working-day heuristic would put the tax base wrong on the dates that decide which tax year an income falls into. That is why deriving nothing is the only correct option and not merely the tidier one (018 FR-015). So the series declares every calendar day, declares no non-publication rule, nothing is derived, and there is nothing for a working-day calendar to do. What is NOT settled is legal effect -- whether the value dated Sunday is the rate IN FORCE on Sunday per the Tax Code -- which is owner verification task 1, closed by reading пункт 10 розділу III of the Положення № 148 approves plus пп. 164.4 and п. 292.5 ПКУ. It is unread, not unknowable, and if it resolves the other way 018 FR-015 restores this dependency. Three findings the spec reports: `InputKind` has no official-rate member so no manifest can name the series a tax base rested on; `observation_for` rebuilds a dict of every observation per lookup; and the publisher offers TOMORROW'S rate today, which the loader refuses as future-dated, so the fetch must stop at its own retrieval date or write a file that does not load. All three were invisible at zero rows. Do not restate the spec here."

[[feature]]
id     = "019-decision-layer"
status = "planned"
needs  = ["015-the-question", "016-real-ovdp"]
why    = "015 because a dominance pass runs over what a horizon section evaluated -- section_evaluated is 015's, and its FR-030 withholding is what the pass must not decide standings from; 016 because the reason 014 gave for not building the non-dominated set was the measured size of the set, and 24 real issues is what expires it. Transitively covers 014 (every dimension the pass reads is 014 FR-020's) and 010 (the ranking, tie and benchmark rules it carries unchanged)."
note   = "ALL FOUR CLARIFICATIONS ANSWERED 2026-09-03, so planning may start; the questions, the options and the owner's own words are in specs/decisions/2026-09-03-clarify-019.toml -- do not restate them. Three measurements were re-read under the answers rather than left standing: the benchmark counts, and the non-dominated sets at the declared bands, which the bands leave unchanged. Written for the registry AFTER the owner's 2026-09-02 decision (OVDP fixtures out, a real ISIN as benchmark), and the spec defines 'the shipped registry' as that state, once. Closes I2 only; Section A moves by nothing and the reason per row is decided rather than left. Four pieces of work sit outside this feature's module: the question schema's objective-set field (015), a slack-width function in core/primitives/tolerance.py, an InputKind member for the objective set, and the CLI rendering -- which includes Comparison.ties and Comparison.beats_benchmark, computed by the core today and appearing nowhere in src/terezy/cli/. PLANNED 2026-09-05. The three mechanics FR-011d left to the plan are settled in research.md D6: a fraction band resolves against the ONE amount the question states in the currency the pair is compared in, lazily -- only for a currency some pair is actually compared in; absent versus ambiguous are TWO typed refusals rather than a zero or an incomparable pair, because the cause is a declaration and not a figure; and the resolved width is carried once per (criterion, currency) on the section's result. TWO THINGS THE PLAN DID NOT CLOSE, both costs of the FRACTION shape rather than of the rule, and both the owner's line to write. First: his TOKEN 1.00 USD amount for contract_usd would resolve his 0.01 % to a band of 0.0001 USD, and that CLEARS FR-011c's floor -- the floor at two objectives is one slack, max(1e-9*|x|, 1e-9), which 1e-4 exceeds for any figure below 100 000; lazy resolution only keeps the width from being computed while no candidate delivers USD. Second, and likelier: 015 requires an amount for EVERY declared stream, so a second UAH stream is a routine data edit, and two amounts in one currency leave a fraction band with no single width -- FR-011's relation must be symmetric, so one currency admits one width -- and every section refuses. An ABSOLUTE money band, which FR-011d already permits, is immune to both. IMPLEMENTATION IS BLOCKED ON TWO BRANCHES NOT YET ON MAIN: fix/coupon-inside-the-window moves TupleOutcome.reaches, which IS the money objective, so the spec's non-dominated counts of 2, 3 and 10 are pre-fix readings and no test pins them; feat/real-only-registry is what makes 'the shipped registry' exist, and without it every section refuses under FR-018. That second branch ALSO already renders beats_benchmark, resolved to keys and narrowed to the reported population, in cli/main.py::_beats_line -- so what still reaches no reader after it lands is the TIE GROUPS themselves, and FR-029's task is scoped to those plus the three dominance populations."

[[feature]]
id     = "020-http-api"
status = "done"
needs  = ["007-cpi-real-terms", "008-seed-and-goals", "009-tax-depth", "011-official-rate", "012-fop-group-3", "015-the-question", "017-working-day-calendar", "018-nbu-rate-series"]
why    = "one endpoint per declaration category, so every feature that OWNS a category must exist before there is a response type to write: 007 CPI, 008 seeds and goals, 009 tax timing, 011 official rates, 012 schemes and destinations, 017 calendars. 015 brings the answer endpoint; 018 makes a windowed series read testable against data rather than an empty file. All eight are done, so this blocks nothing -- the list is long because the surface is wide."
note   = "Lifts D-B (owner decision 2026-09-03, specs/decisions/2026-09-03-web-stack.toml lands with 021). ALL THREE CLARIFICATIONS ANSWERED 2026-09-03 (specs/decisions/2026-09-03-clarify-020.toml) and written into the requirements they govern; do not restate them here. The first defers the display switch ENTIRELY -- no parameter, no block, no conversion -- which is wider than the standing behaviour the draft shipped, so REQUIRED_TESTS F2 stays open and the three options travel on the display-currency-switch future entry below. The load-bearing measurement: 314 frozen core records carry no kind tag and ten groups share an identical field set -- OneWayCost and RoundTripCost among them, whose separation Principle VI requires and mypy currently supplies. Serialisation is where that guard is lost."

[[feature]]
id     = "021-web-declared-data"
status = "done"
