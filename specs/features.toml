[[future]]
id    = "superseded-exit-visibility"
after = ["003-route-coverage"]
note  = "a spendable destination satisfies its own exit by identity (003 FR-002, owner decision 2026-08-23), and the sentinel supersedes any exit routes actually declared from it -- so those declarations appear nowhere in the report: not relied on, not orphaned, not a deficit. Unreachable in the shipped registry, where nothing exits a spendable venue, and stated at the sites that carry it rather than hidden. Making them visible costs the mirror with satisfied-by-arrival, which is why it is the owner's call and not the implementer's. 014 is the first caller to rely on it: `core/decision/candidates.py::_ways_out` emits the sentinel and enumerates no chain beside it, so exit routes declared from a spendable venue are superseded exactly as recorded here rather than appearing as a second way out."

