status = "done"
needs  = ["002-ramp-cost", "006-inzhur-instruments"]
why    = "connect ramp to instrument purchases: net-of-access-cost comparison (§8 q1) and the H1 data-only full-pipeline test"

[[feature]]
id     = "011-official-rate"
status = "in-progress"
needs  = ["002-ramp-cost"]
why    = "the tax-currency role (Principle VI) has never had machinery: 011's per-kind staleness threshold follows 002's FR-028 and lands in the same `data/observation_kinds.toml`, and 011's central prohibition — the official rate never prices a leg, a channel rate never strikes a tax base — is the rule 002 already wrote at `core/routes/legs.py::channel_for` and `data/declarations/resolver.py::_check_channel`, which 011 must leave standing"
note   = "no open clarifications. One owner verification task -- the clause naming which official rate governs a day the NBU does not set one -- and FR-017 ships its refusal live, so the gap is in the output rather than only in prose. Declaring the rule is NOT a data-only change: it is written in working days and public holidays, so it needs the declared-working-day-calendar future entry below (FR-018). The citation, the retrieval record and what the paraphrase lost are in the spec's owner verification task 1; nothing is repeated here."

[[feature]]
id     = "012-fop-group-3"
status = "spec"
needs  = ["002-ramp-cost", "006-inzhur-instruments", "011-official-rate"]
why    = "006 for dated rate schedules (E10) — the regime's levy commences on a date a second law set, a month after the date its own law named — and for the precedent of a declaration naming tax classes instead of carrying a rate; 011 because the base is the credited foreign amount at the official rate on the CREDIT date, a different number from the hryvnia the compulsory sale produces; 002 because the scalar `IncomeStream.income_tax_rate` that 012 retires is 002's FR-007, and the deployable-capacity types whose undeclared-is-not-zero behaviour must survive the migration are 002's"
note   = "no open clarifications. Six owner verification tasks, two load-bearing; every legal value is cited to a primary text and carries an empty verified_on. **What the verdicts are for each crediting destination, and the two criteria that assign them, are stated once in the spec under 'Legal grounding' and applied there in a table. Do not restate them here** -- this note carried a copy through three review rounds and the copy is what went stale each time."

[[feature]]
id     = "013-enumerated-schedule"
status = "spec"
needs  = ["009-tax-depth", "010-full-tuple"]
why    = "010 because the feature's central success criterion is a full-tuple comparison -- an enumerated and a generative declaration with the same cash flows must produce identical figures and the same ranking position, which is only assertable once the join exists; 009 because a secondary-market purchase realises a premium or discount at redemption (31 of the 32 observed issues quote above face), and whether that loss may reduce another base is a question about 009's per-category netting and carryforward. Transitively covers 001 (the generative form this one sits beside), 002 and 006 (the two-differently-taxed-classes fixture FR-010 requires)."
note   = "No open clarifications. One was drafted on 2026-08-24 -- the tax character of the premium a secondary-market OVDP is bought at -- and WITHDRAWN the same day, because the answer was already declared and cited in data/tax/timing/ua.toml. **Do not restate that declaration here.** The withdrawal, what the draft had failed to read, and why the question decides no reachable figure are in the spec under \"The premium, and why it is not a clarification\"; the provision and the category fields are in the data file, which is the thing that changes if the law does. The note directly above this one records what a third copy costs. What survives the withdrawal is 013 FR-026, and the first review corrected it: the netting case is not hypothetical, because FR-010's mandated fixture reaches it inside this feature, so it is asserted rather than warned about. Three blocking findings answered 2026-08-27 in specs/decisions/2026-08-27-clarify-013.toml -- the enumerated form carries a day count, the sites that read a generative field ask the declaration instead, and payment order is settled at transcription."

