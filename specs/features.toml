[[future]]
id    = "martial-law-ends-one-belief-two-places"
after = ["006-inzhur-instruments"]
note  = "TWO military-levy facts hang off the end of martial law, both read in the consolidated ПКУ at zakon.rada.gov.ua/laws/show/2755-17/print on 2026-08-25 (станом на 24.08.2026). (1) The ФОП group-3 levy simply ENDS -- it runs «по 31 грудня третього календарного року, наступного за роком, у якому буде припинено або скасовано воєнний стан» (абзац п’ятий підпункту 1.1 пункту 16-1 підрозділу 10 розділу ХХ, as amended by Закон № 4835-IX від 07.04.2026 over № 4015-IX’s original «по 31 грудня року, у якому») -- and there is no reversion rate for group 3. (2) The 5% levy on ORDINARY PERSONAL INCOME reverts to 1,5% «Починаючи з 1 січня року, наступного за третім календарним роком після року, у якому буде припинено або скасовано воєнний стан» (абзац шостий підпункту 1.3, also as amended by № 4835-IX; the pre-2026 wording was «наступного за роком, у якому»). Neither has a DATE -- both are conditioned on an event -- and that same event is already declared as a belief in data/scenarios/war_end.toml, where it switches the route set. So a dated tax schedule and a scenario regime hang off one assumption and nothing in the system knows it: a run can assume the war ends for routing and simultaneously charge the levy for ever. Needs a schedule entry whose effective date is a regime transition rather than a date, which is a real modelling question (a schedule keyed by a scenario is no longer a pure fold over dates) and not a tidy-up. Recorded 2026-08-23 during 006; corrected 2026-08-25 during 012, after № 4835-IX was found and the group-3 termination turned out to be a different fact from the personal-income reversion; deliberately not built. THE ID KEEPS THE OLD COUNT DELIBERATELY -- this string is cited from landed spec prose, a plan and two declaration files, and renaming it would touch a declaration file for a word. THREE PLACES AS OF 2026-08-30: specifying 017 established a third fact hanging off the same event -- Ukraine's public-holiday regime, because ч. 6 ст. 6 Закону № 2136-IX (в редакції Закону № 2352-IX від 01.07.2022, read at zakon.rada.gov.ua/laws/show/2136-20/print) suspends статті 53 і 73 КЗпП for the duration of martial law, and those are exactly the святковий and передсвятковий vocabulary НБУ пункт 10 is written in. 017 records it and REFUSES TO DEEPEN IT: its FR-019 forbids a calendar declaration keyed to martial law ending, so an enumerated calendar states what each declared year's law was and refuses past its window rather than adding one more conditional. What is NOT settled -- whether the НБУ's holiday vocabulary follows КЗпП's suspension at all -- is 017 owner verification task 2, and 018's retrieved series can falsify a reading of it though it may never become one."

[[future]]
id    = "horizon-as-a-latency-budget"
after = ["014-candidates"]
note  = "A path whose total latency exceeds the comparison's horizon is INFEASIBLE, not expensive -- and 010 does not have that rule. Two gaps, both read in the code on 2026-08-29 rather than supposed. (1) `CannotSpanHorizon` is constructed at exactly two sites in `core/decision/tuple_outcome.py`, and BOTH hard-code an instrument term -- `binding_term=\"instrument.maturity_date\"` in `_bond_outcome`, `\"instrument.terminates_on\"` in the fund arm -- `binding_term` is a bare `str`, so nothing in the type forbids a route id -- the true and sufficient claim is that neither site produces one and the record carries no route id to name. A way IN whose declared latency pushes `purchased_on = horizon.start + latency_days` past `horizon.end` therefore reaches that refusal with the binding term naming the instrument rather than the corridor that was actually slow. A mis-attributed binding term hands the owner the wrong remedy: shorten the horizon, when what would fix it is a faster corridor. (2) On the way OUT there is no check at all -- `span.end` is `max(arrival.arrived_on)` and an exit chain's latency may carry arrivals past `horizon.end` with nothing refusing. That one is UNREFUSED, not mis-measured: `implied_rate` is an IRR over `span`, so a late arrival is already priced by the owner decision that put waiting inside the span. What breaks is comparability against candidates measured over the horizon, and VISIBILITY -- `_rests_on` fires only on the undershoot, so an outcome that ran past the horizon says nothing at all on its face. Whether the remedy is a refusal, a stated assumption, or neither is the modelling question; the first half is a plain gap and this one is not. Both are changes to 010's `TupleRefused` union under 014 FR-006, made and reviewed there, and both move figures 010's goldens pin. What makes it worth building: a latency budget is a pruning rule that kills whole branches early, which is what the search version of 014 rests on. Recorded 2026-08-29 while specifying 014; deliberately not built."

[[future]]
id    = "provenance-on-a-refusal"
after = ["014-candidates"]
note  = "010's seventeen refusal records carry a `reason` string and NO provenance. That is invisible while a refusal is read one at a time and becomes visible the moment 014 reports a tally: `BelowMinimumTicket` rests on a declared minimum ticket, `RouteInCapExceeded` on a declared monthly cap, and either may be unverified or stale -- so 'twelve candidates dropped' is a decision-relevant figure standing on marked inputs with no way to say which. 014 FR-024 carries the registry's merged mark onto the SET, which keeps the set from looking cleaner than the registry, and deliberately does not close the per-drop half. Closing it means adding a provenance field to the union's members, which touches every construction site and every match arm -- a change to 010, reviewed against 010's tests, and not a local workaround inside the loop. Principle I's propagation rule is the reason it is not simply dropped. Recorded 2026-08-29 while specifying 014."

[[future]]
id    = "one-amount-per-stream-in-compare"
after = ["014-candidates"]
note  = "`core/decision/compare.py::compare` takes ONE `amount: Money` and scores every tuple in the set with it, while 014 FR-001 and FR-005 take an amount PER INCOME STREAM and forbid converting one into the other. The two agree only while a candidate set is single-stream, which is what the shipped registry yields (`contract_usd` connects to nothing inbound), so 014 SC-015 is constructible today and a two-stream set cannot be handed to `compare` at all. The fix is 010's to make -- one amount per stream on the call, struck against each tuple's own `stream_id` -- and it is a change to 010, made and reviewed there on the rule 014 FR-014a states, rather than a per-stream loop in the caller, which would produce one ranking per stream and no ranking of the set. Recorded 2026-08-30 while repairing 014's specification; deliberately not built. 014 SHIPPED THE REFUSAL RATHER THAN THE FIX: `survey` returns `MoreThanOneStreamInTheSet` naming both streams, so the disagreement is a typed output rather than a single amount silently scoring a set it does not describe. Unreachable from the shipped registry, and reached in `tests/unit/test_candidate_survey.py` by declaring the inbound USD-to-UAH corridor the registry lacks -- which is also the smallest change that makes the gap live."

[[future]]
id    = "zero-hop-way-in"
after = ["014-candidates"]
note  = "A stream that already arrives, in the right currency, at the venue an instrument is bought at needs no way in -- and `Tuple.route_in` is required, so that candidate is not representable. `compose` already refuses the question in exactly those words (`core/routes/compose.py::_refusal`: 'money that is already where it was wanted'), and 014 FR-014 carries that text verbatim onto the pair so it is never mistaken for a corridor nobody declared. What is missing is the candidate itself. **The same fact on the way OUT is already solved**: 003's FR-002 lets a spendable destination satisfy its own exit, and `EXIT_BY_IDENTITY` in `core/routes/path.py` is that sentinel -- so the shape of the fix is known and its argument is written down. Unreachable in the shipped registry, where every instrument is bought at `inzhur` and neither stream arrives there; it becomes live the day an instrument is declared bought at `monobank_uah` or `deel`. Recorded 2026-08-29 while specifying 014, as a gap rather than a clarification, because nothing today reaches it. 014 MADE IT VISIBLE: such a pair now stands in the no-candidate column carrying `NothingNeedsToConnect`, which holds compose's whole refusal record -- so its `case` distinguishes it from an undeclared corridor structurally and its `reason` reaches a reader verbatim (`tests/unit/test_no_candidate_column.py` asserts the text was not rewritten). What is still missing is the candidate."

[[future]]
id    = "real-terms-for-a-tuple"
after = ["007-cpi-real-terms", "010-full-tuple"]
note  = "A tuple has NO real-terms rate. Read in the code on 2026-08-30 rather than supposed: `TupleOutcome.implied_rate` is typed `NominalRate | RateNotComparable`, and the `RealRate | RealTermsUnavailable` slot 007 built lives on feature 001's hurdle record (`core/results/hurdle.py`) and on nothing the join produces. So a comparison of instruments answers in nominal terms only, while the benchmark it is ranked against can state a real one -- and the owner's question names inflation explicitly. Deflating the nominal rate is not a presentation choice: it is a new figure needing a formula, a `docs/METHODOLOGY.md` entry and a worked example, it must refuse by name where no CPI series covers the span (007's existing behaviour), and it is a change to 010's outcome record that moves figures 010's and 014's goldens pin. 015 states it as an EXCLUSION rather than filling it (015 FR-023a), which is why this is a recorded gap and not a silent absence. Recorded 2026-08-30 while specifying 015; deliberately not built."

[[future]]
id    = "secondary-market-rate-risk"
after = ["015-the-question", "016-real-ovdp"]
note  = "A bond sold before maturity fetches what the market pays that day, and 015 prices such a sale with the PLATFORM'S SPREAD ALONE. **The measured spreads are in 015's spec under 'Clarifications' and are reproducible from `data/observations/inzhur.toml`; do not restate them here** -- the 015 note above says exactly that, and a copy in the same commit would be the shape those notes exist to prevent. What the spread does NOT carry is rate risk, and 015 FR-033 requires the omission to be stated as TWO claims because only one of them has a sign: the figure is unconditionally MORE CERTAIN than the truth, since a distribution is replaced by a point for the option chosen for its optionality; but the LEVEL is not signed, because rate risk is symmetric -- a bond sold after rates FALL fetches more than its spread implies. A separate and genuinely signed omission sits beside it, that a seller's quote widens exactly when a forced sale is most likely, so the SPREAD ITSELF is understated. The first draft folded all three into one directional claim about the level, which was an approximation asserting a sign it could not warrant. Building this is a secondary-market model -- a discount curve, or at minimum a declared rate-shock scenario the resale price is struck under -- and it belongs after 016, because it needs real issues with real maturities before it can be checked against anything. Recorded 2026-08-30 while specifying 015; deliberately not built."

