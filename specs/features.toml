# The feature dependency graph. Parseable with tomllib; semantics in specs/README.md.
#
# status: queued | spec | planned | in-progress | done
#   queued       accepted by the owner; spec-writing may start, no spec.md yet
#   spec         spec.md exists, clarifications resolved
#   planned      plan.md + tasks.md exist
#   in-progress  implementation started
#   done         landed on main, required-test rows flipped
#
# needs: features that must be `done` on main before THIS feature's implementation
# starts. Spec-writing is always parallelisable and ignores `needs`.
# Two features are parallelisable iff neither transitively needs the other.

[[feature]]
id     = "001-ovdp-hurdle-rate"
status = "done"
needs  = []

[[feature]]
id     = "002-ramp-cost"
status = "done"
needs  = ["001-ovdp-hurdle-rate"]

[[feature]]
id     = "003-route-coverage"
status = "done"
needs  = ["002-ramp-cost"]

[[feature]]
id     = "004-composed-paths"
status = "in-progress"
needs  = ["002-ramp-cost", "003-route-coverage"]
why    = "the spendable-endpoint list is declared by 003 (its FR-004); 004's composed exit chains end there (its FR-022)"

[[feature]]
id     = "005-route-diagrams"
status = "spec"
needs  = ["002-ramp-cost"]

[[feature]]
id     = "006-inzhur-instruments"
status = "spec"
needs  = ["001-ovdp-hurdle-rate"]
why    = "REIT/MilTech as declared instruments: two tax classes on one instrument (E1), redemption windows and haircuts (J3), rates as dated schedules (E10)"

[[feature]]
id     = "007-cpi-real-terms"
status = "spec"
needs  = ["001-ovdp-hurdle-rate"]
why    = "fill HurdleRate.real; 001 FR-022 reserved the slot"

[[feature]]
id     = "008-seed-and-goals"
status = "spec"
needs  = ["001-ovdp-hurdle-rate"]
why    = "seed lots with known/estimated basis (J2) and target sum/date/contribution goals (J1)"

[[feature]]
id     = "009-tax-depth"
status = "spec"
needs  = ["001-ovdp-hurdle-rate", "006-inzhur-instruments"]
why    = "loss offset and carryforward (E2), average/specific lot methods (E6), tax paid from cash next year (E7); 006's redemption is the first real disposal with a gain"

[[feature]]
id     = "010-full-tuple"
status = "spec"
needs  = ["002-ramp-cost", "006-inzhur-instruments"]
why    = "connect ramp to instrument purchases: net-of-access-cost comparison (§8 q1) and the H1 data-only full-pipeline test"

# Named future work — seams already recorded inside landed specs, not yet features.

[[future]]
id    = "restructuring-scenario"
after = ["001-ovdp-hurdle-rate"]
note  = "OVDP 40% haircut + 2y delay, hand-computed (D3); proposed 2026-08-22, not yet taken"

[[future]]
id    = "coverage-enforcement"
after = ["003-route-coverage"]
note  = "advisory -> binding: ranking excludes non-spendable exits; 003 FR-019 deferral"

[[future]]
id    = "superseded-exit-visibility"
after = ["003-route-coverage"]
note  = "a spendable destination satisfies its own exit by identity (003 FR-002, owner decision 2026-08-23), and the sentinel supersedes any exit routes actually declared from it -- so those declarations appear nowhere in the report: not relied on, not orphaned, not a deficit. Unreachable in the shipped registry, where nothing exits a spendable venue, and stated at three sites rather than hidden. Making them visible costs the mirror with satisfied-by-arrival, which is why it is the owner's call and not the implementer's"

[[future]]
id    = "instrument-access-nodes"
after = ["004-composed-paths"]
note  = "instruments as terminal nodes; 004 FR-014 deferral, owner-confirmed future need"

[[future]]
id    = "fx-tax-asymmetry-f1"
after = ["002-ramp-cost"]
note  = "flat-in-USD posts taxable UAH gain; needs a taxable foreign instrument + dated official rates"

[[future]]
id    = "provider-automation"
after = ["006-inzhur-instruments"]
note  = "owner-requested (2026-08-22): automated fetch layer for external data — fund terms, CPI, FX rates — via the reserved Provider interface; cached with provenance, never silently"

[[future]]
id    = "multi-currency-goals"
after = ["008-seed-and-goals"]
note  = "owner-requested (2026-08-22): goals in non-base currencies once multi-jurisdiction support lands (E8); refused-with-reason until then"

[[future]]
id    = "forced-sale-policy"
after = ["009-tax-depth"]
note  = "owner-deferred (2026-08-22): which positions a forced tax-payment sale draws on and how it is sized; until then insufficient cash is a typed insolvency report — E7 closes only partially in 009"
