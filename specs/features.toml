# The feature dependency graph. Parseable with tomllib; semantics in specs/README.md.
#
# status: queued | drafted | spec | planned | in-progress | done
#   queued       accepted by the owner; spec-writing may start, no spec.md yet
#   drafted      spec.md exists, one or more [NEEDS CLARIFICATION] still open. Planning
#                may not start: the whole point of the marker is that guessing the answer
#                is what the process exists to prevent. Added 2026-08-23, when 011 and 012
#                landed written-but-unresolved and neither `queued` nor `spec` was true of
#                them -- a vocabulary with no word for a real state invites picking the
#                nearest false one.
#   spec         spec.md exists, clarifications resolved
#   planned      plan.md + tasks.md exist
#   in-progress  implementation started
#   done         landed on main, required-test rows flipped
#
# needs: features that must be `done` on main before THIS feature's implementation
# starts. Spec-writing is always parallelisable and ignores `needs`.
# Two features are parallelisable iff neither transitively needs the other.

[[feature]]
id     = "001-ovdp-hurdle-rate"
status = "done"
needs  = []

[[feature]]
id     = "002-ramp-cost"
status = "done"
needs  = ["001-ovdp-hurdle-rate"]

[[feature]]
id     = "003-route-coverage"
status = "done"
needs  = ["002-ramp-cost"]

[[feature]]
id     = "004-composed-paths"
status = "done"
needs  = ["002-ramp-cost", "003-route-coverage"]
why    = "the spendable-endpoint list is declared by 003 (its FR-004); 004's composed exit chains end there (its FR-022)"

[[feature]]
id     = "005-route-diagrams"
status = "done"
needs  = ["002-ramp-cost"]

[[feature]]
id     = "006-inzhur-instruments"
status = "done"
needs  = ["001-ovdp-hurdle-rate"]
why    = "REIT/MilTech as declared instruments: two tax classes on one instrument (E1), redemption windows and haircuts (J3), rates as dated schedules (E10)"

[[feature]]
id     = "007-cpi-real-terms"
status = "done"
needs  = ["001-ovdp-hurdle-rate"]
why    = "fill HurdleRate.real; 001 FR-022 reserved the slot"

[[feature]]
id     = "008-seed-and-goals"
status = "done"
needs  = ["001-ovdp-hurdle-rate"]
why    = "seed lots with known/estimated basis (J2) and target sum/date/contribution goals (J1)"

[[feature]]
id     = "009-tax-depth"
status = "spec"
needs  = ["001-ovdp-hurdle-rate", "006-inzhur-instruments"]
why    = "loss offset and carryforward (E2), average/specific lot methods (E6), tax paid from cash next year (E7); 006's redemption is the first real disposal with a gain"

[[feature]]
id     = "010-full-tuple"
status = "in-progress"
needs  = ["002-ramp-cost", "006-inzhur-instruments"]
why    = "connect ramp to instrument purchases: net-of-access-cost comparison (§8 q1) and the H1 data-only full-pipeline test"

[[feature]]
id     = "011-official-rate"
status = "drafted"
needs  = ["002-ramp-cost"]
why    = "the tax-currency role (Principle VI) has never had machinery: 011's per-kind staleness threshold follows 002's FR-028 and lands in the same `data/observation_kinds.toml`, and 011's central prohibition — the official rate never prices a leg, a channel rate never strikes a tax base — is the rule 002 already wrote at `core/routes/legs.py::channel_for` and `data/declarations/resolver.py::_check_channel`, which 011 must leave standing"
note   = "one open [NEEDS CLARIFICATION] (FR-011): the citable primary text of the NBU rule for a date no rate is published for. Not a blocker — the specified default in its absence is a refusal — but it must reach /speckit-clarify before planning"

[[feature]]
id     = "012-fop-group-3"
status = "drafted"
needs  = ["002-ramp-cost", "006-inzhur-instruments", "011-official-rate"]
why    = "006 for dated rate schedules (E10) — the regime's two components commence on different dates under one law — and for the precedent of a declaration naming tax classes instead of carrying a rate; 011 because the base is the credited foreign amount at the official rate on the CREDIT date, a different number from the hryvnia the compulsory sale produces; 002 because the scalar `IncomeStream.income_tax_rate` that 012 retires is 002's FR-007, and the deployable-capacity types whose undeclared-is-not-zero behaviour must survive the migration are 002's"
note   = "one open [NEEDS CLARIFICATION] (FR-022): whether contract income credited somewhere other than the ФОП account falls under this regime at all — a legal question, not a modelling choice. Until answered, such a stream refuses rather than being charged at these rates. Five owner verification tasks are recorded in the spec, the load-bearing one being the statutory ЄСВ monthly amounts"

# Named future work — seams already recorded inside landed specs, not yet features.

[[future]]
id    = "restructuring-scenario"
after = ["001-ovdp-hurdle-rate"]
note  = "OVDP 40% haircut + 2y delay, hand-computed (D3); proposed 2026-08-22, not yet taken"

[[future]]
id    = "coverage-enforcement"
after = ["003-route-coverage"]
note  = "advisory -> binding: ranking excludes non-spendable exits; 003 FR-019 deferral"

[[future]]
id    = "superseded-exit-visibility"
after = ["003-route-coverage"]
note  = "a spendable destination satisfies its own exit by identity (003 FR-002, owner decision 2026-08-23), and the sentinel supersedes any exit routes actually declared from it -- so those declarations appear nowhere in the report: not relied on, not orphaned, not a deficit. Unreachable in the shipped registry, where nothing exits a spendable venue, and stated at three sites rather than hidden. Making them visible costs the mirror with satisfied-by-arrival, which is why it is the owner's call and not the implementer's"

[[future]]
id    = "instrument-access-nodes"
after = ["004-composed-paths"]
note  = "instruments as terminal nodes; 004 FR-014 deferral, owner-confirmed future need"

[[future]]
id    = "fx-tax-asymmetry-f1"
after = ["002-ramp-cost"]
note  = "flat-in-USD posts taxable UAH gain; needs a taxable foreign instrument + dated official rates"

[[future]]
id    = "provider-automation"
after = ["006-inzhur-instruments"]
note  = "owner-requested (2026-08-22): automated fetch layer for external data — fund terms, CPI, FX rates — via the reserved Provider interface; cached with provenance, never silently"

[[future]]
id    = "multi-currency-goals"
after = ["008-seed-and-goals"]
note  = "owner-requested (2026-08-22): goals in non-base currencies once multi-jurisdiction support lands (E8); refused-with-reason until then"

[[future]]
id    = "forced-sale-policy"
after = ["009-tax-depth"]
note  = "owner-deferred (2026-08-22): which positions a forced tax-payment sale draws on and how it is sized; until then insufficient cash is a typed insolvency report — E7 closes only partially in 009"

[[future]]
id    = "martial-law-ends-one-belief-two-places"
after = ["006-inzhur-instruments"]
note  = "The 5% military levy reverts to 1,5% 'з 1 січня року, наступного за роком, у якому буде припинено або скасовано воєнний стан' (Закон № 4015-IX, zakon.rada.gov.ua/laws/show/4015-20). The reversion has NO date -- it is conditioned on an event -- and that same event is already declared as a belief in data/scenarios/war_end.toml, where it switches the route set. So a dated tax schedule and a scenario regime hang off one assumption and nothing in the system knows it: a run can assume the war ends for routing and simultaneously charge 5% for ever. Needs a rate entry whose effective date is a regime transition rather than a date, which is a real modelling question (a schedule keyed by a scenario is no longer a pure fold over dates) and not a tidy-up. Recorded 2026-08-23 during 006; deliberately not built."
