note  = "`scripts/check_provenance.py::_uncited_inferences` requires EVERY enumerated schedule table to begin its citation `INFERENCE:` and refuses a non-empty `verified_on` on it. Written when a seller's unlabelled list was the only source, and correct for that. The NBU depository states the currency, the nominal, the payment kinds and the whole schedule, so a declaration transcribed from it infers NONE of the four -- and the gate makes it write that it does. THE OWNER CHOSE DATA-ONLY for 016 on 2026-08-30, so the 24 declarations ship carrying a false word in a true citation and their terms stay unverified. The remedy is small and is specified in 016 FR-011: let a schedule that cites the depository stand without the marker and carry a verification date -- a few lines in one check, not a change to the loader, the declaration record or any interface. Recorded so the cost has a named remedy rather than only a complaint. Deliberately not built."

[[future]]
id    = "rates-in-one-ranking-span-different-periods"
after = ["015-the-question", "016-real-ovdp"]
note  = "A COMPARABILITY BREAK, visible from 2026-09-02 -- the first day the owner's question ranked anything. NAMED FOR THE SET, not for the hurdle: an earlier id said `the-hurdle-undershoots-every-horizon`, which was true of one benchmark and of no rule. `implied_rate` is an IRR over the SPAN the money was at work, so a candidate whose own terms end inside the window is annualised over that shorter span while the rest are annualised over the window, and the ordering puts both in one list. It is a property of the SET of spans and not of any one row: on the owner's own question 1, 3 and 12 of 24 ranked rows undershoot at his three horizons, whichever issue is the benchmark. THE WORKED INSTANCE that made it visible was `UA4000235865`, benchmark until 2026-09-03: it matured 2026-09-16, so its span was the same 18 days at all three horizons and at twelve months `beats_benchmark` was EMPTY -- which reads as `nothing beats it` and meant `nothing was measured against it`. It was NOT a loss, though 49 760.50 against a 50 000 outlay looks like one: 680.64 stayed at `inzhur` as `UndeployedCash` (the minimum increment) and the rate is measured on what was actually invested, so conflating outlay with `reaches` is the reading the outcome's own reason exists to refuse. The owner replaced it with `UA4000231195` on 2026-09-03, whose terms end 2027-08-25 -- which moves the worked instance and closes nothing. `src/terezy/cli/main.py::_span_caveat` now states, per section, the range of span lengths against the window, and that is a caveat rather than a fix: the ordering is still across periods of different length. It is the mirror of `horizon-as-a-latency-budget`'s second half, which records the OVERSHOOT (an outcome running past the horizon says nothing on its face); this is the undershoot, and the undershoot at least fires `_rests_on`. THE REMEDY IS THE OWNER'S: a different benchmark, or a declared rule about a candidate that undershoots its horizon -- reinvestment needs a rate, an instrument, an entry cost and a tax treatment, none of them declared, so an implementer choosing one would be inventing the largest term in his comparison. Recorded 2026-09-02 while landing the real-only registry; deliberately not built."

[[future]]
id    = "the-answer-digest-is-blind-to-the-hurdle"
after = ["015-the-question"]
note  = "`core/results/canonical.py::_of_section_outcome` encodes a `Comparison` as its type name, its evaluated outcomes (via `_evaluated_of`) and its refusals -- and NOT `benchmark`, `ties` or `beats_benchmark`. So two answers over one registry that measure everything against DIFFERENT issues have the SAME `digest_of_answer`, and so do two that disagree about what tied and what beat the hurdle. Found 2026-09-03 when the owner moved the benchmark from `UA4000235865` to `UA4000231195`: `tests/golden/the_answer.golden.txt` moved by exactly one rendered line and its digest did not move at all. INVISIBLE UNTIL NOW because every section of the shipped question was `BenchmarkUnavailable` until 2026-09-02, so those three fields never carried a meaningful value in a shipped answer. NOT UNGUARDED: the golden renders `[benchmark]` and `tests/golden/test_the_answer.py::test_the_recorded_artefact_ranks_every_bond_against_the_declared_benchmark` asserts it, so the artefact catches the change -- what does not catch it is the digest, which is what a manifest carries and what a second run is compared on. That is the `a golden that does not move is a green build` shape Principle V's rationale names. The fix is a few fields in one encoder, and it MOVES EVERY ANSWER DIGEST, which is why it is the owner's call rather than a tidy-up: he should decide whether a hurdle change is supposed to be a new digest. Deliberately not built."

