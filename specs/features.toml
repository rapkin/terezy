[[future]]
id    = "martial-law-ends-one-belief-two-places"
after = ["006-inzhur-instruments"]
note  = "TWO military-levy facts hang off the end of martial law, both read in the consolidated ПКУ at zakon.rada.gov.ua/laws/show/2755-17/print on 2026-08-25 (станом на 24.08.2026). (1) The ФОП group-3 levy simply ENDS -- it runs «по 31 грудня третього календарного року, наступного за роком, у якому буде припинено або скасовано воєнний стан» (абзац п’ятий підпункту 1.1 пункту 16-1 підрозділу 10 розділу ХХ, as amended by Закон № 4835-IX від 07.04.2026 over № 4015-IX’s original «по 31 грудня року, у якому») -- and there is no reversion rate for group 3. (2) The 5% levy on ORDINARY PERSONAL INCOME reverts to 1,5% «Починаючи з 1 січня року, наступного за третім календарним роком після року, у якому буде припинено або скасовано воєнний стан» (абзац шостий підпункту 1.3, also as amended by № 4835-IX; the pre-2026 wording was «наступного за роком, у якому»). Neither has a DATE -- both are conditioned on an event -- and that same event is already declared as a belief in data/scenarios/war_end.toml, where it switches the route set. So a dated tax schedule and a scenario regime hang off one assumption and nothing in the system knows it: a run can assume the war ends for routing and simultaneously charge the levy for ever. Needs a schedule entry whose effective date is a regime transition rather than a date, which is a real modelling question (a schedule keyed by a scenario is no longer a pure fold over dates) and not a tidy-up. Recorded 2026-08-23 during 006; corrected 2026-08-25 during 012, after № 4835-IX was found and the group-3 termination turned out to be a different fact from the personal-income reversion; deliberately not built."

[[future]]
id    = "enumerated-accrued-interest"
after = ["013-enumerated-schedule"]
note  = "013 FR-017 forbids an accrued-interest figure, a clean price, or any separation of a purchase price into a clean and an accrued part for an enumerated instrument, because two facts are missing: the start of the accrual period containing the purchase, and the basis interest accrues on within it. NEITHER OF THEM IS THE ISSUE DATE, which is the correction worth recording: accrual needs the PREVIOUS COUPON DATE, and the issue date stands in for it only when the purchase falls before the first coupon. In the 2026-08-24 observation the previous coupon date is inside the published window for 19 of the 24 active issues -- UA4000234413 publishes 2026-07-14 against a retrieval date of 2026-08-24 -- so the split is recoverable later from a declared previous-coupon date plus a declared accrual basis, with no issue date anywhere. Deferred rather than built because nothing in the engine computes accrued interest today, and a typed refusal for a figure nobody asks for is dead code. What makes it worth building: under a TAXABLE enumerated bond, a buyer pays accrued interest in the purchase price and receives it back as taxable coupon income, which overstates the income. Under the ОВДП exemption that costs nothing, which is luck rather than design -- the same shape as 013 FR-010. Recorded 2026-08-24 while specifying 013."
