[project]
name = "terezy"
version = "0.1.0"
description = "Decision-support framework for a UAH-income investor: instruments, routes, taxes, and honest strategy comparison."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mikola Parfenyuck" }]

dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    # Pinned exactly: the OpenAPI document a second codebase is generated from is a function of
    # the JSON Schema this emits, so an unpinned minor moves the wire contract with no source
    # change and no diff to read (020 FR-037).
    "pydantic==2.13.4",
]

[project.scripts]
# One subcommand over one record. argparse rather than the `cli` extra: a library installed for
# one subcommand is one more thing between a person and their answer (015 research D11).
terezy = "terezy.cli.main:main"

[project.optional-dependencies]
api = [
    # All three pinned exactly, for one reason: the OpenAPI document's bytes come from all of
    # them -- Starlette owns the paths, FastAPI assembles the document, Pydantic emits every
    # schema inside it. `fastapi` declares `starlette>=0.46.0`
    # with no upper bound, so a resolver may legitimately cross a major version (020 FR-037).
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
]
cli = [
    "typer>=0.15",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pandas-stubs>=2.2",
    "syrupy>=4.8",
    "httpx>=0.28",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terezy"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # comprehensions
    "DTZ",         # flake8-datetimez — naive datetimes are a real bug class here
    "T20",         # no print() in library code
    "PT",          # pytest style
    "RET",         # return simplification
    "SIM",         # simplify
    "ARG",         # unused arguments
    "PTH",         # use pathlib
    "ERA",         # commented-out code
    "PL",          # pylint subset
    "TRY",         # exception anti-patterns
    "FLY",         # static join
    "NPY",         # numpy legacy random etc.
    "PD",          # pandas-vet
    "RUF",
]
ignore = [
    "TRY003",      # long messages in raise are wanted: errors must name file + field
    "PLR0913",     # financial constructors legitimately take many parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "ARG001", "ARG002"]
"src/terezy/cli/**" = ["T20"]      # the CLI is allowed to write to stdout
# This script writes a Ukrainian-language declaration header quoting two statutory provisions
# verbatim. RUF001 flags a Cyrillic word every one of whose letters has an ASCII lookalike --
# «особа», «ЗУ», «КМУ», «у» -- which is what a legal citation is made of. Paraphrasing to please
# the linter would be editing a quotation.
"scripts/fetch_nbu_rates.py" = ["RUF001"]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["types"]

# ---------------------------------------------------------------------------
# mypy — strict on the core, per constitution "Quality gates in CI"
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
]
# A silent `Any` is how provenance and typing both get lost.
disallow_any_explicit = false
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "invariant: property-based invariant tests (Principle IV)",
    "worked_example: hand-computed arithmetic checked into the repo (Principle V)",
    "golden: end-to-end run compared against a checked-in golden result",
    "contract: data-only extensibility and plugin-boundary tests (Principle II)",
    "slow: excluded from the fast feedback loop",
]
filterwarnings = [
    "error",
    # Tests must never reach the network; if something tries, surface it loudly.
]
xfail_strict = true

# ---------------------------------------------------------------------------
# Coverage — the floor is a blocking gate
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/terezy"]
branch = true

[tool.coverage.report]
# Raise this as the core fills in; it must never be lowered without a note in the PR.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "\\.\\.\\.$",
]
