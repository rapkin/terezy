# SYNTHETIC FIXTURE JURISDICTION. Every rate and every date in this file is invented.
#
# It exists for SC-010: a third fund declared purely as data, with a **different tax
# schedule** from the two real ones, must produce complete results with zero lines of
# source code changed. A fixture that reused `data/tax/ua.toml` would prove the fund is
# data; it would not prove the *schedule* is, because both real classes carry a single
# dated entry.
#
# So the payout class below carries **two** dated entries, which makes the third fund a
# working example of a rate that changes mid-holding as well as a working example of a
# data-only instrument.
#
# NOTHING HERE DESCRIBES ANY REAL TAX SYSTEM. The rates are chosen to be unmistakable —
# 7%, 3%, 11%, 4% — precisely so that no figure computed from them could be mistaken for a
# Ukrainian one, and no value here may be quoted as if it were law.

[jurisdiction]
id            = "synthetic_fixture"
name          = "SYNTHETIC FIXTURE jurisdiction — invented rates, not any real law"
base_currency = "UAH"

[[jurisdiction.tax_class]]
id         = "synthetic_fund_payout"
applies_to = ["distribution"]
note       = "FIXTURE — an invented payout class whose rates step on an invented date, so that a data-only fund can also exercise a dated schedule."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-01-01"
  pit_rate_pct   = 7.0
  levy_rate_pct  = 3.0
  note           = "FIXTURE — invented rates on an invented date. Read off nothing; not a claim about any jurisdiction."
  kind           = "tax_rule"
  source         = "SYNTHETIC FIXTURE — not an observation of anything."
  retrieved_on   = "2026-08-23"
  verified_on    = ""

  [[jurisdiction.tax_class.rate]]
  effective_from = "2028-01-01"
  pit_rate_pct   = 11.0
  levy_rate_pct  = 4.0
  note           = "FIXTURE — the second entry, so a holding spanning 2028 is charged at both. Invented, like the first."
  kind           = "tax_rule"
  source         = "SYNTHETIC FIXTURE — not an observation of anything."
  retrieved_on   = "2026-08-23"
  verified_on    = ""

[[jurisdiction.tax_class]]
id         = "synthetic_fund_disposal"
applies_to = ["disposal_gain"]
note       = "FIXTURE — an invented disposal class, so the third fund declares two classes that are not the two real ones."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-01-01"
  pit_rate_pct   = 13.0
  levy_rate_pct  = 2.0
  note           = "FIXTURE — invented rates on an invented date."
  kind           = "tax_rule"
  source         = "SYNTHETIC FIXTURE — not an observation of anything."
  retrieved_on   = "2026-08-23"
  verified_on    = ""

# ---------------------------------------------------------------------------
# 013: the two classes that make a payment's declared label load-bearing
# ---------------------------------------------------------------------------
#
# FR-010. For ОВДП both income kinds are exempt, so mislabelling a payment as a coupon
# rather than a repayment of principal changes NO FIGURE on the instruments that motivate
# the enumerated form. That is luck rather than design, and it is exactly the condition
# under which a defect ships: the first taxable enumerated instrument makes every earlier
# mislabelling visible at once.
#
# So these two classes carry DIFFERENT invented rates — 8% in total on a coupon, 15% on a
# disposal — and relabelling one payment on an instrument that declares them moves the tax
# total by a hand-computable amount. Nothing here describes any real tax system.

[[jurisdiction.tax_class]]
id         = "synthetic_enumerated_coupon"
applies_to = ["coupon"]
note       = "FIXTURE — an invented coupon class, rated differently from the disposal class beside it so that a payment's declared label is provably load-bearing (013 FR-010)."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-01-01"
  pit_rate_pct   = 6.0
  levy_rate_pct  = 2.0
  note           = "FIXTURE — invented rates on an invented date. Read off nothing."
  kind           = "tax_rule"
  source         = "SYNTHETIC FIXTURE — not an observation of anything."
  retrieved_on   = "2026-08-29"
  verified_on    = ""

[[jurisdiction.tax_class]]
id         = "synthetic_enumerated_disposal"
applies_to = ["disposal_gain"]
note       = "FIXTURE — an invented disposal class in a NETTING category (see ../timing/synthetic_fixture.toml), so that 013 FR-026's netting case is exercised rather than warned about: a purchase at a premium realises a loss at redemption, and whether that loss reduces the year's base is the question a netting category answers and an exempt one does not."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-01-01"
  pit_rate_pct   = 12.0
  levy_rate_pct  = 3.0
  note           = "FIXTURE — invented rates on an invented date."
  kind           = "tax_rule"
  source         = "SYNTHETIC FIXTURE — not an observation of anything."
  retrieved_on   = "2026-08-29"
  verified_on    = ""
