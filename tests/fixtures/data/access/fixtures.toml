# How each fixture instrument is reached: the same shape as `data/access/instruments.toml`,
# beside it rather than in it. `access/` is globbed, so the two files merge and a second row
# for one instrument is still refused at load.
#
# Every price here is invented and every `verified_on` is empty, so every figure derived from
# one carries the unverified mark.

# --- the two synthetic OVDP issues ------------------------------------------------------

[[access]]
instrument_id = "ovdp_synthetic_a"
bought_at     = "inzhur"
proceeds_to   = "inzhur"
risk_class    = "sovereign_debt"

  [access.price]
  per_unit     = 1000.0
  currency     = "UAH"
  kind         = "venue_terms"
  source       = "SYNTHETIC FIXTURE — the price implied by this fixture's own header, which states that issue A is 'bought at par'. Par is its declared face value of 1000.0 UAH. Not a quote observed at any venue, and not a claim about any real issue."
  retrieved_on = "2026-08-23"
  verified_on  = ""

[[access]]
instrument_id = "ovdp_synthetic_b"
bought_at     = "inzhur"
proceeds_to   = "inzhur"
risk_class    = "sovereign_debt"

  [access.price]
  per_unit     = 1000.0
  currency     = "UAH"
  kind         = "venue_terms"
  source       = "SYNTHETIC FIXTURE — par, on issue A's reading, so that the two fixtures differ in their conventions and their minimum ticket rather than in their price. Not observed anywhere."
  retrieved_on = "2026-08-23"
  verified_on  = ""

