# SYNTHETIC FIXTURE. Every close below is invented and no venue published one.
#
# It stands where scripts/fetch_binance.py would write, in the shape it writes, so that a held
# position with a PRICE is reachable by a test. The shipped tree carries no observation file at
# all -- a committed price is a price nobody re-fetched -- so without this the only held path a
# suite could walk would be the refusal.
#
# Every `verified_on` is empty, as a fetched one's is and must stay: a downloaded number is not
# a checked number, and here there is nothing to check it against.

retrieved_on = "2026-08-31"
endpoint     = "https://data-api.binance.vision/api/v3/klines"
symbol       = "SYNTHUSDT"
interval     = "1d"

