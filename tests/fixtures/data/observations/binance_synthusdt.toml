on_date      = "2026-08-25"
close        = 60000.0
kind         = "market_quotation"
source       = "SYNTHETIC FIXTURE — an invented daily close. No venue published this figure and no endpoint returned it; it exists so the priced path of a held position is reachable by a test. Written by hand in the shape scripts/fetch_binance.py writes."
