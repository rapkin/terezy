# Where money can sit, and which currencies each place can hold.
#
# ⚙ **This file is not named by `contracts/declaration-schema.md`, and it has to exist.**
# `core.routes.venues.Venue` declares the currencies a venue can hold precisely so that a
# leg moving dollars into a hryvnia-only account is a load-time failure naming the file
# and the leg index (FR-024) — and the resolver cannot make that check against a venue
# nobody declared. Principle II also requires that *adding a venue* be a data-only change
# (FR-021, SC-010), which is unreachable if the venue set lives in code. The contract
# enumerates routes, channels, streams and observation kinds and simply does not mention
# venues; this file is the missing half, declared in the shape of
# `observation_kinds.toml` — one flat list at the data root, because a venue is a
# structural identifier rather than a directory of sourced observations.
#
# **No citation keys, and that is deliberate.** A venue table carries no observed numeric
# value — an id, a name, and a set of currency codes — so there is nothing here for a
# source to vouch for, and `core.routes.venues.Venue` has no provenance field to carry
# one. The same reading as feature 001's `[instrument.tax_classes]`, which holds
# references rather than observations and cites nothing. Every *number* attached to a
# venue lives on a leg, in `data/routes/`, with its own citation.
#
# SYNTHETIC FIXTURE. The venues are the ones `SIMULATOR_SPEC.md` §4.2 and §4.3 name, but
# which currencies each account actually holds has not been confirmed with the providers.

[[venue]]
id         = "monobank_uah"
name       = "Monobank multi-currency card — the UAH salary rail (SYNTHETIC FIXTURE)"
currencies = ["UAH", "USD"]

[[venue]]
id         = "binance"
name       = "Binance account, including its UAH peer-to-peer book (SYNTHETIC FIXTURE)"
currencies = ["UAH", "USD"]

[[venue]]
id         = "coinbase"
name       = "Coinbase account — one of the two places Deel can send the contract income (SYNTHETIC FIXTURE)"
currencies = ["USD"]

[[venue]]
id         = "ibkr_usd"
name       = "Interactive Brokers, USD cash account (SYNTHETIC FIXTURE)"
currencies = ["USD"]

[[venue]]
id         = "inzhur"
name       = "Inzhur fund platform, hryvnia only (SYNTHETIC FIXTURE)"
currencies = ["UAH"]

# --- Added 2026-08-23, from the owner's description of his actual flow ---

[[venue]]
id         = "deel"
name       = "Deel — where the contract income lands and where the owner first controls it"
currencies = ["USD"]
# The first point of control in the whole chain: the Deel cabinet is where the owner
# chooses what happens next, and that choice is exactly a declared route out of here.
# Deel is not a place money rests -- it is the fork.

[[venue]]
id         = "fop"
name       = "ФОП account — the sole-proprietor account, currency and hryvnia sides"
currencies = ["USD", "UAH"]
# Both currencies at one venue on purpose. Dollars arrive here and, under Ukrainian
# currency rules, must be sold before they can be spent domestically -- so (fop, USD)
# and (fop, UAH) are two destinations with a declared conversion between them, which is
# what the mandatory sale actually is. Whether that sale is legally compulsory is not
# modelled: what is declared is that a corridor exists and what it costs.

# --- Added 2026-08-30 (feature 012). Places income can be CREDITED, not places it routes ---
#
# Both exist because the tax question reaches them: `data/tax/destinations/ua.toml` records
# what the owner's income would be worth credited at each, and that table is normative — a
# destination it has no row for refuses rather than being reasoned about.
#
# **Neither carries a declared route, in or out, and nothing reports that.** The coverage
# audit is scoped to declared spendable endpoints and the corridors that reach them, so it
# says nothing about a venue nothing routes to; what does show them is the route diagram,
# where they render as isolated nodes carrying no mark. That is a true picture of this
# registry — no money moves to either place in the shipped data — and it is stated here
# because a reader meeting two unmarked nodes deserves to know they are unmarked on purpose.

[[venue]]
id         = "payoneer"
name       = "Payoneer — an international payment system, dollars only"
currencies = ["USD"]
# ДПС treats it as a «небанківська установа», which is the whole of why the treatment of
# income credited here is disputed. The dispute is in the destinations table; this row only
# says the place exists and what it can hold.

[[venue]]
id         = "foreign_bank_usd"
name       = "A bank account outside Ukraine, dollars"
currencies = ["USD"]
# A category rather than a named bank, because the two ДПС documents that reach it are about
# «рахунок, відкритий у іноземному банку» in general and name no institution. Declaring a
# particular bank would be narrower than the sources.
