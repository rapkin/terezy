# The owner's declared belief about what an early exit is struck at.
#
# **Everything in this file is an assumption, and that is what it carries instead of a
# citation.** `data/scenarios/` is exempt from the provenance requirement by design (see
# `data/README.md`), and this file is a stronger case than most: there is nothing a source
# could vouch for. A platform that *committed* to its quoted buyback price would have declared a
# TERM, and the term would live on the access declaration beside the price. The assumption
# exists precisely because none does.
#
# **A subdirectory, and the nesting is deliberate.** `data/scenarios/*.toml` is globbed and
# validated as scenario documents (regimes and transitions); `glob` does not recurse, so this
# file keeps the directory's citation exemption without pretending to be a scenario. The same
# reading `data/scenarios/inflation/` already carries.
#
# **No default, and the absence of the file is the absence of the policy** (015 FR-032). A run
# with no belief declared here refuses at load naming this directory rather than assuming the
# quotation holds: a forgotten line must never read as a chosen policy, and the figure the
# default would produce is exactly the invented number Principle I exists to prevent.
#
# **What it is not.** It is not a claim that an early exit is free, and it does not decide
# whether one is possible: an instrument whose access declaration quotes no resale price refuses
# by name instead, and this belief is never reached for it.
#
# **The direction of the error is stated, not hidden.** The figure it produces is more certain
# than the world is, and understates the spread; the sale price is struck below what this same
# belief implies, because whole coupons come out of the quotation where the accrual inside it
# cannot; and rate risk is symmetric and is deliberately not signed. Those claims reach a reader
# as typed exclusions on every early-exit figure (015 FR-033), so they cannot be dropped by a
# renderer that did not know to print them.

[early_exit]
id            = "quotation_holds_net_of_detached_coupons"
owner_id      = "owner-001"
is_assumption = true

rationale     = "OWNER'S BELIEF, not an observation. Inzhur publishes a buy and a sell price for every active issue and the gap between them is 0.000% to 0.637% of the buy price (median 0.237%, five issues quoting buy equal to sell, retrieved 2026-08-24). What is assumed to hold at a future exit date is that quotation LESS EVERY COUPON THAT DETACHED WHILE THE HOLDING HELD THE PAPER — the clean price is taken as constant and the price moves only by detachment. Carrying the quotation to the sale date unchanged instead is not the smaller assumption, it is a wrong number: a quoted bond price is a dirty price and falls by its coupon on the day the coupon detaches, so a holding credited a coupon inside the window and sold at a price quoted before it would be credited that money twice. The subtraction opens at the PURCHASE and not at the quotation's own day because the buy quotation of the same morning sizes the purchase as declared: a coupon paid between the two — two shipped issues pay one on 2026-08-26 — is inside both prices and received by neither holder, and taking it out of one alone would report a loss nobody took. Taking the gap to hold at all is the smallest assumption that makes an early exit representable — the alternative is refusing every horizon shorter than an instrument's own terms, which answers a different question from the one asked. It is a belief about the future and nobody knows it: a seller's quote widens exactly when a forced sale is most likely, and eleven of the twenty-four active issues publish available_quantity = 0 without saying what that field constrains. What comes out is a WHOLE coupon where what was in the quotation was the accrual it had built up, so a sale from which a coupon detached is struck below what this belief implies — declaring the accrual basis that would close the gap is a separate piece of work and inventing one here would be the number this project exists to refuse."
