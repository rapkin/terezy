# The vocabulary a question is written in: the labels an instrument can declare itself into.
#
# **The owner asks in groups, and none of his words is an instrument id.** "Compare cash, OVDP,
# Inzhur and BTC" names two families and two things nobody has declared. A subject that could
# only be an id would put every issue in the question file, and every new issue would then be a
# hand edit that is silently wrong until somebody makes it. Under a group, a new issue joins by
# carrying the label and the question file does not change at all.
#
# **A group is a declared LABEL, never a rule** (015 FR-007a). An instrument says which groups
# it is in; nothing here says which instruments are in it, and nothing anywhere computes
# membership. Four inferences would agree with the labels on some registry and none of them is
# the label: the instrument **class** (fixed income is not the same set as ОВДП), the **venue**
# (`inzhur` is a venue id too, and every access declaration names it), the **tax class** (a
# legal fact about an instrument, where a group is what the owner calls it) and the **id
# prefix**. `tests/contract/test_group_membership_is_declared.py` builds one instrument that
# trips all four and asserts it is in no group.
#
# **Root-level and curated, beside `venues.toml`.** The label lives on the curated instrument
# declaration, so a per-owner vocabulary would make an instrument file fail to load because
# somebody else's directory was absent. No citation keys: an id and a name are references, not
# observations, exactly as a venue's are. `scripts/check_provenance.py` **does** scan this file —
# it globs the data root's own `*.toml` as well as the sourced directories — and it passes
# because there is no observed value here, not because nothing looked.
#
# **An instrument may be in several groups, and two groups may overlap** (015 FR-007b). Feature
# 016 declares ОВДП issues sold *through* Inzhur, so `ovdp` and `inzhur` are not disjoint and
# the owner's own question names both. An id reached twice yields one candidate and is counted
# once.

[[group]]
id   = "ovdp"
name = "Ukrainian government bonds (ОВДП)"

[[group]]
id   = "inzhur"
name = "Inzhur funds"
