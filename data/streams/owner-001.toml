# The owner's income streams. **Per-owner data, not curated data.**
#
# This directory is separate from `data/routes/` and `data/channels/` for a structural
# reason rather than a tidiness one (Principle VII): a route is a public fact about a
# corridor, shared across owners, while a salary is one person's. Putting both in one
# directory would make the boundary a matter of reading field names, and that boundary is
# what makes multi-user cheap later.
#
# **Streams carry no `source` and no `verified_on`, and that is an exemption with an
# argument.** An owner's own salary is not an observation needing a citation; it is a
# statement of fact by the only person who can make it. The same exemption
# `data/scenarios/` already has. `scripts/check_provenance.py` therefore does not scan this
# directory — and `contracts/declaration-schema.md` and research.md D9 both say so
# explicitly, after a first draft got it wrong.
#
# **The amounts are `0.0`, which is the honest placeholder.** `SIMULATOR_SPEC.md` §11 item 3
# records that the owner's actual monthly figures have not been stated. A zero produces a
# zero result rather than a made-up one; inventing a salary would put a number in every
# downstream figure that nobody declared.
#
# **`income_tax_rate_pct` is omitted from both streams, and omission is a claim.** It means
# *the owner has not stated a rate* — which is different from stating zero. So
# `streams.deployable` returns `IncomeTaxRateUndeclared`, a record with no net field at all,
# rather than a net figure that quietly equals the gross. Declaring `0.0` here would be
# worse than leaving it out: it would assert that nothing is withheld from a Ukrainian
# salary, which is false, and it is not mine to assert on the owner's behalf. The field is
# exempt from the citation requirement for the reason the contract gives — §4.2 puts the
# owner's own income-tax position outside the simulator, and this field exists only so the
# deployable figure is not overstated.
#
# **Why two streams in two currencies.** §4.2: money that *arrives* in dollars needs no
# hryvnia-to-dollar conversion to reach a dollar asset. That is the whole of G1 and the
# reason access cost is keyed by `(destination × stream × route)` and never by destination
# alone (FR-008). One stream would make the finding untestable.

[[stream]]
id         = "salary_uah"
owner_id   = "owner-001"
currency   = "UAH"
amount     = 0.0
cadence    = "monthly"
arrives_at = "monobank_uah"

  [stream.indexation]
  policy = "cpi"

[[stream]]
id         = "contract_usd"
owner_id   = "owner-001"
currency   = "USD"
amount     = 0.0
cadence    = "monthly"
arrives_at = "coinbase"

  [stream.indexation]
  policy = "none"
