# SYNTHETIC FIXTURE. This file is `ovdp_synthetic_a.toml` said the other way round.
#
# Its purpose is one assertion (013 SC-002): a tuple built on a bond declared by its terms
# and a tuple built on a bond declared by the payments those terms produce must agree on
# every figure and take the same position in the ranking. If they do not, the two forms are
# not two encodings of one thing — they are two concepts sharing an interface, and the right
# response is to stop rather than to add a branch.
#
# EVERY AMOUNT BELOW IS TRANSCRIBED AT FULL FLOAT64 PRECISION from
# `face x coupon_rate x year_fraction` under issue A's declared terms — 1000.0 face, 15.5%,
# act/365, semiannual from 2026-01-15 to 2028-01-15. Rounding them to kopecks would make the
# totals miss the project tolerance by accumulated rounding rather than by anything the
# comparison is about, and the test would then be measuring the transcription.
#
# THE LAST TWO PAYMENTS FALL ON 2028-01-17, not on the 2028-01-15 the terms name: issue A
# declares the `following` business-day rule and 2028-01-15 is a Saturday. That is the whole
# of what a business-day rule does — it moves the date money changes hands — and here it has
# already been applied, by whoever published the schedule. Nothing in this file names a rule,
# because none was applied by this engine.
#
# The final coupon and the repayment of principal share that date, as two entries, which is
# how a bond ordinarily ends.

