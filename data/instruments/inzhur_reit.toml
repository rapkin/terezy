# ІНЖУР REIT — a real, buyable fund, researched from its own primary documents.
#
# **RESEARCHED IS NOT VERIFIED.** Every value below was read on 2026-08-22 from the fund's
# регламент (ред. 07.05.2025), its проспект (28.05.2025), its fund page and Inzhur's own
# news, and every `verified_on` is EMPTY until the owner checks it against his investor
# cabinet. That is the expected state, not a defect: the mark propagates to every figure
# derived from these terms (FR-002), and `scripts/check_provenance.py` reports them as
# unverified rather than failing.
#
# **THIS IS AN ASSUMPTION-DRIVEN INSTRUMENT.** No volatility, no Sharpe, no Sortino, no
# statistical metric may ever be emitted for it. Its projections are contractual arithmetic
# over the terms below plus the owner's stated assumptions, and the output says so.
#
# **Income is declared in USD-equivalent terms; the money is hryvnia** (owner decision A).
# Ukrainian commercial rents are priced against the dollar and settled in hryvnia under a
# «граничний курс» — a ceiling on the rate. So the payout is *sized* in USD and *paid* in
# UAH, and every hryvnia figure needs an exchange-rate assumption the owner states. There
# is no rate feed here and none is invented.
#
# **What the primary documents do not answer is recorded** as
# `[[instrument.verification_task]]` entries, which carry no value field at all. A
# projection needing one refuses by naming the task rather than filling in a plausible
# number. No count is written here: the header said six while the file listed five, and a
# tally beside its own list is the sentence that goes stale first.
#
# **Fees are context, not modelled flows** (owner decision B). The management and
# performance fee clauses are recorded as `[[instrument.fee_fact]]` so a reader can see what
# the declared net yield is net of; nothing accrues from them.

[instrument]
id                   = "inzhur_reit"
name                 = "ІНЖУР REIT — closed-end non-diversified venture fund (ЗНПІФ)"
class                = "collective_investment_fund"
unit_currency        = "UAH"
is_assumption_driven = true
day_count            = "act/365"
terminates_on        = "2045-05-20"

  # No subscription cutoff is declared: the fund page describes an open offer, and the
  # регламент names no closing date for subscriptions. The key is omitted rather than
  # filled with the termination date, which would be a cutoff nobody wrote.

  [instrument.nav]
  per_unit     = 10.9975
  kind         = "fund_terms"
  source       = "https://www.inzhur.reit/offer/inzhur-reit — the net asset value per certificate shown on the fund page, accessed 2026-08-22. The certificate's nominal is 10.00 грн; this is the shown NAV, which is what a purchase and a buyback are priced against. RE-OBSERVED UNCHANGED on 2026-08-24: data/observations/inzhur.toml, entry `inzhur-reit`, records nav 10.9975 from Inzhur's own asset endpoint, retrieved by scripts/fetch_inzhur.py. A seller's quotation, not an independent valuation."
  retrieved_on = "2026-08-24"
  verified_on  = ""

  [instrument.declared_yield]
  low_pct  = 9.5
  high_pct = 9.5
  basis    = "usd_equivalent_annual"
  kind     = "fund_stated_yield"
  source   = "https://www.inzhur.reit/offer/inzhur-reit — the fund's stated target distribution yield of 9.5% a year in USD-equivalent terms, accessed 2026-08-22. A TARGET THE FUND STATES ABOUT ITSELF, not a promise and not an observation of a market. The shown trailing twelve months (11.52%) is an observation of the past and is deliberately NOT entered as a term."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [instrument.distribution]
  frequency        = "monthly"
  basis_note       = "Not less than 90% of net rental profit, distributed monthly. Declared in words and never computed: modelling the fund's own books from outside would be an assumption wearing the shape of a computation (owner decision B)."
  record_day       = "last_day_of_month"
  payment_day      = 10
  paid_in          = "UAH"
  payout_share_pct = 100.0
  kind             = "fund_terms"
  source           = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025) and Проспект (28.05.2025), read in full 2026-08-22, hosted on the d2zk2gr3fhkmim.cloudfront.net host linked from https://www.inzhur.reit/offer/inzhur-reit — monthly distributions of at least 90% of net rental profit, record date the last day of the month, paid by the 10th of the following month, in hryvnia. payout_share_pct is 100 because the stated 9.5% is a DISTRIBUTION target: all of it is paid out and none of it is modelled as NAV growth. Property may well revalue; putting a revaluation figure nobody published into the model would be inventing the fund's balance sheet."
  retrieved_on     = "2026-08-22"
  verified_on      = ""

    [instrument.distribution.peg]
    sized_in = "USD"

      [[instrument.distribution.peg.cap]]
      effective_from = "2023-01-01"
      uah_per_unit   = 37.49
      kind           = "fund_terms"
      source         = "Pre-2025 secondary evidence for the leases' «граничний курс» ladder, recorded in specs/006-inzhur-instruments/spec.md FR-027 from the 2026-08-22 research pass. DATED BY RULE B2 (see data/tax/ua.toml's header for the two rules and why they differ). THE SOURCE GIVES THE YEAR, NOT THE DAY, so the entry takes the first day of the attested year — the earliest date that year can mean. B2 and not B1 because the choice of day changes no figure: cap_on returns the latest entry on or before a payment's date, the distribution class this fund uses starts 2026-06-30, and every projectable payout therefore selects the 2024 entry below whatever day either entry carries. The exact effective date is part of verification task 2. ⚙ UNREACHABLE AS DECLARED, and kept on purpose: the distribution class this fund uses starts 2026-06-30 (data/tax/ua.toml), so no projectable payout can ever select this entry rather than the 2024 one below. It is retained as the evidence for the +10%/yr ladder the 2024 figure rests on — deleting it would leave that claim uncited — and it becomes reachable the day a citation lets the distribution class reach back further."
      retrieved_on   = "2026-08-22"
      verified_on    = ""

      [[instrument.distribution.peg.cap]]
      effective_from = "2024-01-01"
      uah_per_unit   = 41.24
      kind           = "fund_terms"
      source         = "Pre-2025 secondary evidence for the leases' «граничний курс» ladder — the +10%/yr step from 37.49, recorded in specs/006-inzhur-instruments/spec.md FR-027 from the 2026-08-22 research pass. DATED BY RULE B2, from the first day of the attested year, for the same reason as the 2023 entry: the choice of day changes no figure, because every projectable payout is dated after this entry and selects it whichever day in 2024 it carries. ⚙ NOTE THE DIRECTION, so nobody re-derives it backwards: the ladder RISES, and a payment converts at min(assumed rate, ceiling), so a higher ceiling in force earlier would make a payment LARGER, not smaller. If this choice ever did move a figure — a cap entry selectable by some payout — B1 would date a cap increase as late as the year allows, which is the opposite of what is written here. WHETHER THE LADDER SURVIVED INTO THE CONSOLIDATED 2025 FUND IS NOT KNOWN, and no entry is written for 2025 or later. A declared ceiling stays in force until a later one supersedes it, exactly as a tax rate does, so this 41.24 is what a 2027 payment converts against — an assumption the empty verified_on marks and verification task 2 exists to close. What is refused rather than assumed is the other direction: a payment dated BEFORE 2023-01-01 has no declared ceiling at all and is not sized at the full assumed rate."
      retrieved_on   = "2026-08-22"
      verified_on    = ""

  [instrument.spread]
  entry_markup_max_pct   = 1.0
  exit_discount_max_pct  = 1.0
  live_entry_markup_pct  = 1.0
  live_exit_discount_pct = 0.0
  kind                   = "fund_terms"
  source                 = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), read 2026-08-22, for the maxima — an entry markup of up to 1% of NAV and an exit discount of up to 1% of NAV. The live prices are read from data/observations/inzhur.toml, entry `inzhur-reit`, which scripts/fetch_inzhur.py retrieved from https://www.inzhur.reit/_api/assets on 2026-08-24 — Inzhur's own published figures for an instrument it sells, a seller's quotation rather than an independent valuation. buy 11.1075, nav 10.9975, sell 11.0965, and BOTH LIVE PRICES ARE CLEAN MULTIPLES OF nav TO THE PUBLISHED FOUR DECIMALS: 10.9975 × 1.01 = 11.107475 → 11.1075, and 10.9975 × 1.009 = 11.0964775 → 11.0965. Inzhur Energy is struck on the same two multiples in the same retrieval, off a unit six hundred times larger: 6589.0098 × 1.01 → 6654.8999 and × 1.009 → 6648.3109. The six-digit RATIOS differ, 1.010002 here against 1.010000 there, and that is four-decimal rounding on an ~11 грн unit rather than a different multiple. ⚙ THE ARITHMETIC AND THE DOMAIN DISAGREE, AND NEITHER IS DISCARDED. The arithmetic makes nav the base BOTH prices are struck from: a price struck off some other current value would not land on a clean multiple of nav, and two independent funds do not land on the same pair of multiples by accident. The domain says a platform does not buy securities back above what they are worth, and 1.009 is above that base. No reconciliation is in hand, so both are written down and neither is dressed as the answer. ⚙ WHAT THIS REFUSES is the comfortable reading — that nav is a lagging official valuation while the live prices are struck off a current one. The multiples argue against it: an exact multiple of a figure is evidence that the figure IS the base, not that it is not. ENTRY: the entry multiple is exactly the 1% the регламент names, which is why the declared 1.0 stands and why the secondary source claiming zero is contradicted — but it is a multiple of the same unreconciled figure, so it is the best available reading and not a settled fact. Doubt about what nav is takes both halves or neither. EXIT: live_exit_discount_pct is 0.0 because 1.009 is not a discount from nav at all, not because a discount of zero was observed. WHAT IS OBSERVABLE WITHOUT RESOLVING ANY OF IT is the round trip between the two live prices: sell/buy = 1.009/1.01 = 0.999010, a spread of 0.0990%, identical on Energy. ⚙ WHAT THE DECLARED PAIR COSTS: 1% in and 0% out is a round trip of 1 - 1/1.01 = 0.9901%, against the 0.0990% the two live prices span — a factor of exactly ten, since 0.01/1.01 over 0.001/1.01 is 10. The safe direction, and written here so nobody reads the 0.0 as an optimistic exit. No fee structure is invented to close the gap: exact multiples are evidence about arithmetic, not about policy."
  retrieved_on           = "2026-08-24"
  verified_on            = ""

  [instrument.liquidity.legal]
  buyback_before_termination = "discretionary"
  settlement_business_days   = 15
  note                       = "The регламент owes NO buyback before the fund's termination date of 2045-05-20. An earlier exit is at the manager's discretion, at a discretionary discount of up to the declared maximum, settled within 15 business days. This is the floor: everything better than it is a favour, not a right."
  kind                       = "fund_liquidity"
  source                     = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), read in full 2026-08-22 — no redemption windows exist and no buyback obligation arises before termination."
  retrieved_on               = "2026-08-22"
  verified_on                = ""

  [instrument.liquidity.practice]
  settlement_business_days = 0
  is_revocable             = true
  note                     = "In practice Inzhur buys certificates back within hours at zero commission. A REVOCABLE COMPANY PRACTICE, not an obligation: the company may stop the day it becomes expensive, which is precisely when an owner would need it. Every projection assuming this mode says so on its face. ⚙ THIS NOTE USED TO SAY 'AT NAV' AND NO LONGER DOES: in the prices observed 2026-08-24 the buyback is not struck at the fund's published nav figure, and how that price relates to nav is the open verification task below. The withdrawn words were an inference about a field, not an observation of the price."
  kind                     = "fund_liquidity"
  source                   = "https://www.inzhur.reit/offer/inzhur-reit and Inzhur news of 07.04.2025 announcing that the buyback commission was cancelled, accessed 2026-08-22, for the practice and its terms. data/observations/inzhur.toml, entry `inzhur-reit`, retrieved 2026-08-24 by scripts/fetch_inzhur.py, for the published buy/sell/nav prices that show where the buyback is actually struck."
  retrieved_on             = "2026-08-24"
  verified_on              = ""

  [instrument.constraints]
  minimum_units = 1.0
  kind          = "venue_terms"
  source        = "https://www.inzhur.reit/offer/inzhur-reit — the minimum purchase is one certificate, accessed 2026-08-22."
  retrieved_on  = "2026-08-22"
  verified_on   = ""

  [instrument.tax_classes]
  distribution  = "ua_ci_fund_distribution"
  disposal_gain = "ua_investment_profit"

  [[instrument.fee_fact]]
  what         = "Management fee of up to 2% a year of net asset value, accrued at one twelfth monthly and pro-rata reduced in a month the fund underperforms."
  kind         = "fund_terms"
  source       = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), read 2026-08-22. Recorded as context for the declared net yield; nothing accrues from it (owner decision B)."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [[instrument.fee_fact]]
  what         = "Performance fee of up to 25% of profit above the 9.5%-in-USD projection, hard-capped at 15% of profit above a benchmark of the NBU average key rate."
  kind         = "fund_terms"
  source       = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), read 2026-08-22. Recorded as context, not modelled."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [[instrument.fee_fact]]
  what         = "Other fund expenses are capped at 5%."
  kind         = "fund_terms"
  source       = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), read 2026-08-22. Recorded as context, not modelled."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [[instrument.verification_task]]
  question    = "The rate-fixing rule converting the USD-pegged rent into each hryvnia payment: which rate, on which date?"
  searched    = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025) and Проспект (28.05.2025), read in full"
  searched_on = "2026-08-22"

  [[instrument.verification_task]]
  question    = "The current «граничний курс» values, and whether the +10%/yr ladder (2023: 37.49; 2024: 41.24) survives in the consolidated 2025 fund — including the exact effective date of each step, which the evidence gives only by year."
  searched    = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), Проспект (28.05.2025) and the fund page"
  searched_on = "2026-08-22"

  [[instrument.verification_task]]
  question    = "What the `nav` figure Inzhur publishes for this fund IS, and how the two live prices relate to it. Both are struck as clean multiples of it to published precision — nav × 1.01 and nav × 1.009 — so the arithmetic makes nav the base; but a base the buyback prices ABOVE is what the business does not do. Neither the fund page nor the регламент says what the figure is. The fund's own statement of what it means, or of how the buyback price is set, is what closes it — AND IT CLOSES THE ENTRY HALF TOO, because the 1% markup reading is a multiple of the same figure. Until then the declaration records the observable 0.0990% round trip between buy and sell and claims nothing about the base."
  searched    = "The fund page, a secondary broker listing, Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), and the published buy/sell/nav prices observed 2026-08-24"
  searched_on = "2026-08-24"

  [[instrument.verification_task]]
  question    = "The ІНЖУР КЕПІТАЛ investment-firm commission amount, if any."
  searched    = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025), Проспект (28.05.2025) and the fund page"
  searched_on = "2026-08-22"

  [[instrument.verification_task]]
  question    = "Whether any organized secondary market exists for the fund's certificates."
  searched    = "Регламент ЗНПІФ «ІНЖУР REIT» (ред. 07.05.2025) and the fund page"
  searched_on = "2026-08-22"
