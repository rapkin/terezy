# SYNTHETIC FIXTURE. Every term in this file is invented.
#
# The second issue, and its whole purpose is that it is *different*: quarterly rather
# than semiannual, 30/360 rather than act/365, `modified_following` rather than
# `following`, three years rather than two, and a minimum ticket five times the size.
# It shares the `ua_government_bond` tax class with issue A, which is the other half of
# FR-013 -- another instrument reusing an existing class.
#
# SC-003 and SC-012 are the claims this file exists to prove: it produces a complete
# result, with its own conventions reported in its own schedule, and **not one line of
# source code** was written or changed to accept it. If adding a third issue ever needs
# an engine edit, the abstraction is wrong (Principle II).
#
# 30/360 makes every quarter exactly 0.25 of a year, so each coupon is
# 1000 x 0.1225 x 0.25 = 30.625 per unit -- deliberately chosen so the difference from
# issue A's day count is visible in arithmetic a reader can do in their head.

[instrument]
id           = "ovdp_synthetic_b"
name         = "Synthetic OVDP issue B — TEST FIXTURE, terms invented, different conventions"
class        = "fixed_income"
currency     = "UAH"
is_synthetic = true

[instrument.terms]
face_value        = 1000.0
coupon_rate_pct   = 12.25
issue_date        = "2026-03-02"
maturity_date     = "2029-03-02"
periodicity       = "quarterly"
day_count         = "30/360"
business_day_rule = "modified_following"
kind              = "bond_terms"
source            = "SYNTHETIC FIXTURE — terms chosen to differ from issue A in periodicity, day count and business-day rule. Not observed from any issue."
retrieved_on      = "2026-08-21"
verified_on       = ""

[instrument.constraints]
min_ticket   = 5000.0
min_unit     = 1.0
kind         = "venue_terms"
source       = "SYNTHETIC FIXTURE — invented minimum ticket, deliberately larger than issue A's. Not observed from any venue or prospectus."
retrieved_on = "2026-08-21"
verified_on  = ""

[instrument.tax_classes]
coupon        = "ua_government_bond"
disposal_gain = "ua_government_bond"
