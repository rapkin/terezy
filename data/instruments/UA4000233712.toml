# A REAL GOVERNMENT BOND: UA4000233712. Nothing in this file is invented.
#
# TWO SOURCES, AND THEY ARE NEVER MERGED. The TERMS below — currency, face value,
# every payment date, amount and kind, and the coverage claim — are the ISSUER's,
# from the NBU depository register, retrieved 2026-08-31. The PRICE this issue is
# bought and sold at is the SELLER's quotation of 2026-08-24 and lives in
# data/access/instruments.toml. Merging the two would let the issuer's authority
# attach to a figure the issuer never made.
#
# The terms are verifiable against the depository and the price never will be, so
# every figure this issue produces stays marked — and the mark now rests on the price
# rather than on everything at once. Why these 24 issues, why the enumerated form and
# what the INFERENCE marker below costs: specs/016-real-ovdp/spec.md.

[instrument]
id           = "UA4000233712"
name         = "ОВДП UA4000233712 — a real Ukrainian government bond, not a fixture"
class        = "enumerated_schedule"
currency     = "UAH"
is_synthetic = false

# A declared LABEL, never inferred (015 FR-007a).
groups       = ["ovdp"]

[instrument.schedule]
face_value   = 1000.0
covers_from  = "2024-12-03"
day_count    = "act/365"
kind         = "bond_terms"
