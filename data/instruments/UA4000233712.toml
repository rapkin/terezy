[instrument.constraints]
min_ticket   = 1000.0
min_unit     = 1.0
kind         = "venue_terms"
source       = "https://www.inzhur.reit/offer/ovdp — the venue's own offer page for these issues, retrieved 2026-08-31. Its FAQ: «Мінімальний обсяг покупки — від 1 цінного паперу, що дорівнює приблизно 1000 грн», and its summary line «Початкова інвестиція від 1 облігації». The floor the venue states is in UNITS; the 1000.00 is the venue's own «приблизно» for one of them, and it is not this issue's price. This is the venue speaking about its own conditions of dealing, which is the one thing it is primary for."
retrieved_on = "2026-08-31"
verified_on  = ""

# Both income kinds this schedule produces fall in the category the shipped Ukrainian
# rule pack already declares for a government bond. No rate is declared here.
[instrument.tax_classes]
coupon        = "ua_government_bond"
disposal_gain = "ua_government_bond"

[[instrument.verification_task]]
settles     = "face_value"
question    = "What face value does this issue have?"
searched    = "SETTLED by the issuer's depository, which publishes `nominal` for this ISIN at https://bank.gov.ua/depo_securities?json, retrieved 2026-08-31. It is read off nothing. This entry exists because scripts/check_provenance.py requires a task for each of its four inference names on every enumerated schedule, and 016 stays data-only (016 FR-011)."
searched_on = "2026-08-31"

[[instrument.verification_task]]
settles     = "payment_kind"
question    = "Which payments are coupons and which repay principal?"
searched    = "SETTLED by the issuer's depository, which labels every row with `pay_type` — 1 a coupon, 2 a repayment of principal. No kind is read off an amount, a date or a position in a list. Required by the gate rather than open (016 FR-011)."
searched_on = "2026-08-31"

[[instrument.verification_task]]
settles     = "minor_unit_conversion"
question    = "Do the published figures denote hryvnia or kopecks?"
searched    = "SETTLED, and no conversion is performed at all: the depository publishes MAJOR units. The seller publishes the same amounts multiplied by 100 and says nowhere that it quotes kopecks, so a transcription from the seller would have had to choose a reading — and the lot reading, a hundred bonds of 1000 nominal, is what the price refuses. Required by the gate rather than open (016 FR-011)."
searched_on = "2026-08-31"

[[instrument.verification_task]]
settles     = "coverage"
question    = "Is the depository's list complete from placement to maturity, and does the owner accept one register as sufficient evidence that it is?"
searched    = "OPEN, and the only one of these four that is. The register's list starts at or after `razm_date` and ends exactly on `pgs_date` for all 24 declared issues, which is as good as a single source can make the claim; whether the owner wants a second source per ISIN is his call and is owner verification task 3 of specs/016-real-ovdp."
searched_on = "2026-08-31"
