# Inzhur MilTech — a real, buyable fund, researched from its own primary documents.
#
# **RESEARCHED IS NOT VERIFIED.** Every value below was read on 2026-08-22 from the fund's
# регламент (ред. 15.07.2026), its проспект (15.07.2026), its fund page and Inzhur's launch
# news of 12.08.2026. Every `verified_on` is EMPTY until the owner checks it against his
# investor cabinet, and the mark propagates to every figure derived from these terms.
#
# **THIS IS AN ASSUMPTION-DRIVEN INSTRUMENT**, and it is the one where honesty is hardest:
# a fund-stated 25–29% sitting next to a 15.5% tax-exempt government bond invites exactly
# the false precision this project exists to refuse. No volatility, no Sharpe, no
# statistical metric may ever be emitted for it. The tool's job is the erosion arithmetic —
# how much of the stated rate survives the entry/exit spread and the 23% disposal tax —
# reported beside the hurdle rate, on a rate clearly labelled as the fund's own statement.
#
# **THE RATE IS A RANGE AND STAYS A RANGE.** 25–29% is two numbers the fund published, not
# a figure with error bars. A projection reports both ends, or a point the owner chose and
# labelled his own. There is no midpoint anywhere in this project, and that absence is the
# requirement: the midpoint of a fund-stated range is the most seductive invented number in
# the whole feature, because it looks like arithmetic.
#
# **AN ACCUMULATION FUND: no `[instrument.distribution]` table at all.** MilTech owes no
# dividend. That is a declared fact rather than a missing section, and it is why nothing
# invents a payout for it: the whole declared rate accretes to NAV and comes out at the
# exit, taxed once as investment profit rather than monthly as a distribution.
#
# **RECORDED CONTEXT, NOT MODELLED FLOWS** (owner decision B). The underlying bonds pay
# 35-day coupons which reinvest into net asset value, and they mature in July 2029, four
# months before the fund's own end. Neither is modelled as a term: they are the mechanism
# behind the declared rate, and modelling them would mean inventing the fund's book from
# outside. The fee clauses are recorded the same way, as `[[instrument.fee_fact]]`.
#
# **MilTech's outcome distribution is out of scope**, explicitly: the probability of total
# loss, of return of capital, of the target and of the upside are the owner's assumptions
# and belong to the decision layer (`SIMULATOR_SPEC.md` §11 item 6). Nothing here weights
# anything by a probability.
#
# ---------------------------------------------------------------------------
# THE TERM END AND THE SUBSCRIPTION CUTOFF ARE NOT CHECKED BY ANY GATE
# ---------------------------------------------------------------------------
#
# `terminates_on` and `subscription_cutoff` are `fund_terms` observations, read off the
# регламент like every term below and ageing on the same 365-day clock
# (`data/observation_kinds.toml`). They sit on `[instrument]`, which carries no citation
# keys: `FundTable` is `extra="forbid"`, so there is nowhere to put a `source`.
# `scripts/check_provenance.py` exempts both by name and cannot see them — a hole in that
# gate, not a judgement that they need no citation.
#
# Whoever changes either: check it against the регламент by eye, because the gate will not.
# `terminates_on` is the binding term of a refusal, so a wrong one moves money.

[instrument]
id                   = "inzhur_miltech"
name                 = "Inzhur MilTech — closed-end non-diversified venture fund (ЗНПІФ), accumulation"
class                = "collective_investment_fund"
unit_currency        = "UAH"
is_assumption_driven = true
day_count            = "act/365"
terminates_on        = "2029-11-06"
subscription_cutoff  = "2026-12-31"

  [instrument.nav]
  per_unit     = 1006.9654
  kind         = "fund_terms"
  source       = "data/observations/inzhur.toml, entry `inzhur-miltech` — Inzhur published the figure, scripts/fetch_inzhur.py retrieved it from https://www.inzhur.reit/_api/assets on 2026-08-24, and the observation file records it. A seller's quotation for an instrument it sells, not an independent valuation. ⚙ THE ARGUMENT THIS TABLE MADE WAS TESTED AND HELD, and it is kept rather than deleted so a reader can see that. It ran: the fund launched 12.08.2026 and the entry price of ≈ 1 006.97 was read on 2026-08-22 against a nominal of 1 000.00 грн; ten days of the fund's own stated 25-29% on that nominal is about 6.8-7.9 грн and the observed premium was 6.97, so 'NAV has accreted and no markup is charged' fitted the arithmetic while 'nominal plus a 0.697% markup' fitted nothing in particular — and it said plainly that this was the LESS CONSERVATIVE READING, taken anyway because the evidence decided rather than because data/tax/ua.toml's tiebreaker B1 pointed that way. The observation corroborates it directly and without the arithmetic: the endpoint publishes buy, sell and nav as three separate figures, and buy == nav == 1006.9654 to every published digit, so no entry markup is charged and this figure is the net asset value. The priced consequence of the other reading therefore becomes unlikely rather than excluded. ⚙ CORROBORATION AND NOT PROOF: buy == nav is a relationship between two fields of one endpoint, and the same retrieval shows that endpoint's nav does not carry one meaning across the platform — see [instrument.spread]. ⚙ WHAT IT DOES NOT SETTLE, AND THE TWO EXPLANATIONS CANNOT BOTH HOLD: 1 006.97 read on 2026-08-22 and 1 006.9654 published on 2026-08-24 are one figure to the precision of the earlier reading, while two further days of 25-29% on 1 000.00 would add about 1.4-1.6 грн. 2026-08-22 was a SATURDAY and 2026-08-24 a MONDAY, so a NAV struck on business days would have both readings carrying one Friday 21.08 strike and no movement would be expected — which explains the stillness. But that same strike breaks the accretion argument above: 12.08.2026 was a Wednesday, 21.08 is seven business days later, and seven business days of 25-29% on 1 000.00 is 4.79-5.56 грн, which is not the 6.97 observed, while ten CALENDAR days is 6.85-7.95, which is. CALENDAR ACCRETION EXPLAINS THE LAUNCH PREMIUM; A BUSINESS-DAY STRIKE EXPLAINS THE ABSENCE OF MOVEMENT; TOGETHER THEY DO NOT HOLD. Neither is asserted, and the verification task below is what closes it."
  retrieved_on = "2026-08-24"
  verified_on  = ""

  [instrument.declared_yield]
  low_pct      = 25.0
  high_pct     = 29.0
  basis        = "simple_annual"
  kind         = "fund_stated_yield"
  source       = "https://www.inzhur.reit/offer/inzhur-miltech — the fund's stated 25–29% simple annual in hryvnia, accessed 2026-08-22. A RANGE THE FUND STATES ABOUT ITSELF. Not a promise, not a measurement, and not to be collapsed to a point: reported at both ends, or at a point the owner chooses and labels his own."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  # No [instrument.distribution] table: MilTech owes no dividend. See the header.

  [instrument.spread]
  entry_markup_max_pct   = 1.0
  exit_discount_max_pct  = 1.0
  live_entry_markup_pct  = 0.0
  live_exit_discount_pct = 0.5
  kind                   = "fund_terms"
  source                 = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), read 2026-08-22, for the maxima — an entry markup of up to 1% of NAV and an exit discount of up to 1%. THE LIVE SETTINGS ARE NO LONGER INFERENCES: they are measured from data/observations/inzhur.toml, entry `inzhur-miltech`, which scripts/fetch_inzhur.py retrieved from https://www.inzhur.reit/_api/assets on 2026-08-24 — Inzhur's own published figures for an instrument it sells, a seller's quotation rather than an independent valuation. buy 1006.9654, nav 1006.9654, sell 1001.9306: entry markup (buy-nav)/nav = 0.0000%, exit discount (nav-sell)/nav = 0.5000%. ⚙ THE EXIT WAS DECLARED 0.0 AND THE PUBLISHED SELL PRICE IS 0.5% BELOW THE PUBLISHED nav, so every exit this engine costed for MilTech was half a percent better than the price the platform publishes. Whether that 0.5% is a commission, the регламент's discount or something else is not observed and is not named here. That is what the previous note meant by calling the live figures the optimistic reading, and it is the whole correction. ⚙ MILTECH IS THE FUND WHOSE TRIPLE FITS THE РЕГЛАМЕНТ'S SHAPE: sell sits BELOW nav, at 1006.9654 × 0.995 = 1001.93057 → 1001.9306, the published figure to its four decimals, and 0.5% is inside the 1% maximum — so 'a discount from net asset value' describes this price, which is the only reading on this platform that the регламент's own shape allows. It does not hold for every fund in the same retrieval: data/observations/inzhur.toml carries funds whose sell price is a clean multiple ABOVE their published nav, where a discount from NAV cannot reach. So the nav field is not assumed to carry one meaning across the platform, and this 0.5% holds only while MilTech's nav is the base the регламент names — which is the verification task below."
  retrieved_on           = "2026-08-24"
  verified_on            = ""

  [instrument.liquidity.legal]
  buyback_before_termination = "discretionary"
  settlement_business_days   = 15
  note                       = "The регламент owes NO buyback before the fund's termination on 2029-11-06. An earlier exit is at the manager's discretion, at a discretionary discount of up to the declared maximum, settled within 15 business days. For a fund whose underlying bonds mature in July 2029 this is close to a lock-up in practice: the guaranteed exit is the termination payout and nothing else."
  kind                       = "fund_liquidity"
  source                     = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), read in full 2026-08-22 — no redemption windows exist and no buyback obligation arises before termination."
  retrieved_on               = "2026-08-22"
  verified_on                = ""

  [instrument.liquidity.practice]
  settlement_business_days = 0
  is_revocable             = true
  note                     = "SAME-DAY SETTLEMENT, ASSUMED. Inzhur's observed practice on the REIT is to buy certificates back same day at zero commission, and only the settlement half of that is assumed to extend to MilTech here. The price half does not: the endpoint observed 2026-08-24 publishes a MilTech sell price 0.5% below the published nav, so the buyback is not struck at nav. What accounts for the 0.5% is not observed. Nothing observed speaks to how fast a MilTech buyback settles, so the 0 stays an assumption — doubly marked, being a revocable practice nobody has confirmed applies to this fund."
  kind                     = "fund_liquidity"
  source                   = "Inzhur news of 07.04.2025 announcing the cancelled buyback commission, and the launch news of 12.08.2026, accessed 2026-08-22, for the practice on the REIT. data/observations/inzhur.toml, entry `inzhur-miltech`, retrieved 2026-08-24 by scripts/fetch_inzhur.py, for the published MilTech sell price that shows the price half does not carry over."
  retrieved_on             = "2026-08-24"
  verified_on              = ""

  [instrument.constraints]
  minimum_units = 1.0
  kind          = "venue_terms"
  source        = "https://www.inzhur.reit/offer/inzhur-miltech — the minimum purchase is one certificate of 1 000.00 грн nominal, accessed 2026-08-22."
  retrieved_on  = "2026-08-22"
  verified_on   = ""

  [instrument.tax_classes]
  disposal_gain = "ua_investment_profit"

  [[instrument.fee_fact]]
  what         = "Management fee of up to 2% a year of average net asset value, accrued at one twelfth monthly and pro-rata reduced in a month the fund underperforms a 28% benchmark."
  kind         = "fund_terms"
  source       = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), read 2026-08-22. Recorded as context for the declared net yield; nothing accrues from it (owner decision B)."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [[instrument.fee_fact]]
  what         = "NO performance-fee clause. A deliberate absence in the регламент, recorded because an absence a reader has to infer is one they will assume the other way round."
  kind         = "fund_terms"
  source       = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), read in full 2026-08-22 — no performance fee is provided for, unlike the REIT's регламент."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [[instrument.verification_task]]
  question    = "What the `nav` figure Inzhur publishes for this fund IS, and on what schedule it is struck. Two declared values rest on the answer: per_unit takes it as the net asset value, and live_exit_discount_pct reads sell as a 0.5% discount from it. Nothing found says what the figure means. It is the same field from the same endpoint that ІНЖУР REIT records an open task against, and here it carries a second question of its own: the launch premium fits ten CALENDAR days of accretion while the stillness between the Saturday 2026-08-22 reading and the Monday 2026-08-24 one fits a business-day strike, and those two cannot both be true. The fund's own statement of what it publishes and when is what closes both."
  searched    = "The fund page, Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), Проспект (15.07.2026), and the published buy/sell/nav prices observed 2026-08-24"
  searched_on = "2026-08-24"

  [[instrument.verification_task]]
  question    = "The ІНЖУР КЕПІТАЛ investment-firm commission amount, if any."
  searched    = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026), Проспект (15.07.2026) and the fund page"
  searched_on = "2026-08-22"

  [[instrument.verification_task]]
  question    = "How fast a MilTech buyback actually settles. The price half of the assumed practice is answered — the published sell price is 0.5% below the published nav, so the buyback is not struck at nav — but a price endpoint says nothing about settlement, and [instrument.liquidity.practice] still declares same-day on the strength of the REIT's behaviour alone."
  searched    = "Inzhur news of 07.04.2025, the launch news of 12.08.2026, and the published buy/sell/nav prices observed 2026-08-24"
  searched_on = "2026-08-24"

  [[instrument.verification_task]]
  question    = "Whether any organized secondary market exists for MilTech certificates."
  searched    = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026) and the fund page"
  searched_on = "2026-08-22"
