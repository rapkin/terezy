# Inzhur MilTech — a real, buyable fund, researched from its own primary documents.
#
# **RESEARCHED IS NOT VERIFIED.** Every value below was read on 2026-08-22 from the fund's
# регламент (ред. 15.07.2026), its проспект (15.07.2026), its fund page and Inzhur's launch
# news of 12.08.2026. Every `verified_on` is EMPTY until the owner checks it against his
# investor cabinet, and the mark propagates to every figure derived from these terms.
#
# **THIS IS AN ASSUMPTION-DRIVEN INSTRUMENT**, and it is the one where honesty is hardest:
# a fund-stated 25–29% sitting next to a 15.5% tax-exempt government bond invites exactly
# the false precision this project exists to refuse. No volatility, no Sharpe, no
# statistical metric may ever be emitted for it. The tool's job is the erosion arithmetic —
# how much of the stated rate survives the entry/exit spread and the 23% disposal tax —
# reported beside the hurdle rate, on a rate clearly labelled as the fund's own statement.
#
# **THE RATE IS A RANGE AND STAYS A RANGE.** 25–29% is two numbers the fund published, not
# a figure with error bars. A projection reports both ends, or a point the owner chose and
# labelled his own. There is no midpoint anywhere in this project, and that absence is the
# requirement: the midpoint of a fund-stated range is the most seductive invented number in
# the whole feature, because it looks like arithmetic.
#
# **AN ACCUMULATION FUND: no `[instrument.distribution]` table at all.** MilTech owes no
# dividend. That is a declared fact rather than a missing section, and it is why nothing
# invents a payout for it: the whole declared rate accretes to NAV and comes out at the
# exit, taxed once as investment profit rather than monthly as a distribution.
#
# **RECORDED CONTEXT, NOT MODELLED FLOWS** (owner decision B). The underlying bonds pay
# 35-day coupons which reinvest into net asset value, and they mature in July 2029, four
# months before the fund's own end. Neither is modelled as a term: they are the mechanism
# behind the declared rate, and modelling them would mean inventing the fund's book from
# outside. The fee clauses are recorded the same way, as `[[instrument.fee_fact]]`.
#
# **MilTech's outcome distribution is out of scope**, explicitly: the probability of total
# loss, of return of capital, of the target and of the upside are the owner's assumptions
# and belong to the decision layer (`SIMULATOR_SPEC.md` §11 item 6). Nothing here weights
# anything by a probability.

[instrument]
id                   = "inzhur_miltech"
name                 = "Inzhur MilTech — closed-end non-diversified venture fund (ЗНПІФ), accumulation"
class                = "collective_investment_fund"
unit_currency        = "UAH"
is_assumption_driven = true
day_count            = "act/365"
terminates_on        = "2029-11-06"
subscription_cutoff  = "2026-12-31"

  [instrument.nav]
  per_unit     = 1006.97
  kind         = "fund_terms"
  source       = "https://www.inzhur.reit/offer/inzhur-miltech — the live entry price per certificate, accessed 2026-08-22, against a nominal of 1 000.00 грн. Read as the net asset value rather than as nominal-plus-markup, and the reasoning is stated because it is a judgement between two readings of one observation. The fund launched 12.08.2026 and this price was read 2026-08-22; ten days of the fund's own stated 25-29% on a nominal of 1 000.00 is about 6.8-7.9 грн, and the observed premium is 6.97 — so 'NAV has accreted and no markup is charged' fits the arithmetic, while 'nominal plus a 0.697% markup' fits nothing in particular. ⚙ NOTE THAT THIS IS THE LESS CONSERVATIVE READING and it is taken anyway, which is the opposite of what data/tax/ua.toml's rule B1 would do. B1 is a TIEBREAKER for when the evidence does not decide; here it does. The consequence of being wrong is visible: a NAV declared 0.697% high makes every exit 0.697% richer, because the exit prices off accreted NAV while the purchase cost is identical under either reading. Verification task 1 exists to settle it against the live buy and sell prices."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  [instrument.declared_yield]
  low_pct      = 25.0
  high_pct     = 29.0
  basis        = "simple_annual"
  kind         = "fund_stated_yield"
  source       = "https://www.inzhur.reit/offer/inzhur-miltech — the fund's stated 25–29% simple annual in hryvnia, accessed 2026-08-22. A RANGE THE FUND STATES ABOUT ITSELF. Not a promise, not a measurement, and not to be collapsed to a point: reported at both ends, or at a point the owner chooses and labels his own."
  retrieved_on = "2026-08-22"
  verified_on  = ""

  # No [instrument.distribution] table: MilTech owes no dividend. See the header.

  [instrument.spread]
  entry_markup_max_pct   = 1.0
  exit_discount_max_pct  = 1.0
  live_entry_markup_pct  = 0.0
  live_exit_discount_pct = 0.0
  kind                   = "fund_terms"
  source                 = "Регламент ЗНПІФ «Inzhur MilTech» (ред. 15.07.2026) for the maxima — an entry markup of up to 1% of NAV and an exit discount of up to 1%. The LIVE settings are unverified inferences and recorded as such: the entry price of ≈ 1 006.97 against a nominal of 1 000.00 is consistent with no markup being charged, and Inzhur's zero-buyback-commission practice is assumed to extend to this fund. Verification tasks 1 and 3 exist to settle both, and until they are closed the live figures are the optimistic reading."
  retrieved_on           = "2026-08-22"
  verified_on            = ""

