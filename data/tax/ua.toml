# Ukraine, tax-resident individual: the rule pack features 001 and 006 need.
#
# Constitution Principle I — no tax value comes from an implementer's or an agent's
# memory. Every rate below is read off the cited source, and the zeroes carry that
# citation exactly as a non-zero rate would: an uncited zero is the figure that gets
# believed without checking.
#
# `verified_on` is empty throughout: nothing here has been checked against the Tax Code
# itself, only against the secondary sources named. Everything derived from these rates
# renders marked, which is the honest state of affairs and not a defect to work around
# (FR-014, FR-015).
#
# ---------------------------------------------------------------------------
# Rates are DATED SCHEDULES (feature 006, required test E10)
# ---------------------------------------------------------------------------
#
# Each class carries `[[jurisdiction.tax_class.rate]]` entries, oldest first, each with
# its own citation. A legislated change is one entry added here and nothing rebuilt
# (`data/README.md` rule 3, `SIMULATOR_SPEC.md` §4.5.1).
#
# **`effective_from` is a cited legal fact and nothing looser.** Every entry below is
# dated 2026-06-30 for one reason, stated in each entry's note and repeated here because
# it is the most important sentence in this file: the cited source states each rate as
# *current* and gives **no date for when it came into force**. The only date the citation
# attests is its own stated currency — the PwC page carries "Last reviewed - 30 June
# 2026", read from that page on 2026-08-23 while this migration was written — so the
# schedule starts there and **no earlier entry is invented**.
#
# The consequence is deliberate and load-bearing: a taxable event dated before
# 2026-06-30 produces a typed refusal naming the class and the date, rather than a
# defaulted rate or a silent zero (FR-012). A schedule that never refuses is a schedule
# someone back-dated. To charge an earlier event, find a source that attests the earlier
# commencement and add it as a dated entry — do not widen a date.
#
# Known and NOT entered, because no cited commencement date is in hand: the military
# levy went from 1.5% to 5% "in December 2024" (`SIMULATOR_SPEC.md` §4.5.1). The month is
# not a date, and the schedule mechanism can carry that step the day a citation supplies
# one.

[jurisdiction]
id            = "ua"
name          = "Ukraine (tax resident)"
base_currency = "UAH"

# ---------------------------------------------------------------------------

[[jurisdiction.tax_class]]
id         = "ua_government_bond"
applies_to = ["coupon", "disposal_gain"]
note       = "Interest on certain Ukrainian state securities is PIT-exempt, and the military levy is not charged on income not subject to PIT. Applies to coupon and to gain on disposal. The single most decision-relevant number in the model: it is what makes a 15.5% OVDP beat a 15.5% deposit taxed at 23%."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-06-30"
  pit_rate_pct   = 0.0
  levy_rate_pct  = 0.0
  note           = "Rates read off the cited page, which lists 'interest from securities issued by certain state bodies of Ukraine' among the exempt incomes and states the 5% military levy applies to income taxed with PIT — so an exempt income bears neither. THE DATE IS NOT A LEGISLATED COMMENCEMENT DATE. The source states the exemption as current and says nothing about when it began; 2026-06-30 is the page's own 'Last reviewed' date, the earliest date this citation attests the rate was in force. Nothing earlier is claimed, and an event before it is refused rather than charged (FR-012). Verify against the Tax Code of Ukraine and add a dated entry for the actual commencement before any figure derived from this leaves the tool."
  kind           = "tax_rule"
  source         = "https://taxsummaries.pwc.com/ukraine/individual/income-determination (page states 'Last reviewed - 30 June 2026'; listed in SIMULATOR_SPEC.md §12, retrieved 2026-08-21)"
  retrieved_on   = "2026-08-21"
  verified_on    = ""

# ---------------------------------------------------------------------------

[[jurisdiction.tax_class]]
id         = "ua_ci_fund_distribution"
applies_to = ["distribution"]
note       = "Distributions paid by a Ukrainian collective-investment institution (ІСІ) to an individual: 9% PIT, because the payer is a mutual investment fund rather than a CIT payer, plus the 5% military levy on income taxed with PIT — 14% in total. This is the class an Inzhur payout falls under, and it is NOT the class its redemption falls under (see ua_investment_profit). The REIT's own page showing 14% dividend withholding corroborates the split; corroboration is recorded, it is not verification."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-06-30"
  pit_rate_pct   = 9.0
  levy_rate_pct  = 5.0
  note           = "Rates read off the cited page: 'Dividends paid by non-residents, mutual investment funds, and non-payers of CIT in Ukraine are taxed at 9%', and 'the 5% military tax applies to such income if it was taxed with PIT'. Corroborated by the ІСІ sources in SIMULATOR_SPEC.md §12 (Invest-Tandem, KINTO), which state 9% on fund distributions and that the issuer redeeming its own securities is not a tax agent. THE DATE IS NOT A LEGISLATED COMMENCEMENT DATE: neither source dates either rate, so this entry takes the cited page's own 'Last reviewed - 30 June 2026' as the earliest date it attests, and nothing before that is claimed or charged."
  kind           = "tax_rule"
  source         = "https://taxsummaries.pwc.com/ukraine/individual/income-determination (page states 'Last reviewed - 30 June 2026'; listed in SIMULATOR_SPEC.md §12, retrieved 2026-08-21) — corroborated by https://itandem.com.ua/podatky-investoriv-isi/ and https://kinto.com/investing-from-a-tax?language_content_entity=uk"
  retrieved_on   = "2026-08-21"
  verified_on    = ""

# ---------------------------------------------------------------------------

[[jurisdiction.tax_class]]
id         = "ua_investment_profit"
applies_to = ["disposal_gain"]
note       = "Investment profit — the gain realised on disposing of a security, a redemption of collective-investment units included: 18% PIT plus the 5% military levy, 23% in total. Charged on the gain (proceeds less basis less allocated fees), never on the proceeds. This engine reports the charge only; the filing mechanics SIMULATOR_SPEC.md §4.5 records — that the fund redeeming its own securities is not a tax agent, so the individual self-declares — are a later feature, and so is loss carryforward."

  [[jurisdiction.tax_class.rate]]
  effective_from = "2026-06-30"
  pit_rate_pct   = 18.0
  levy_rate_pct  = 5.0
  note           = "Rates read off the cited page: 'Bank interest, as well as most other passive income, is subject to 18% PIT', and 'the 5% military tax applies to such income if it was taxed with PIT'. Corroborated by the YANKIV source in SIMULATOR_SPEC.md §12, which states 18% PIT on investment profit under art. 170.2. THE DATE IS NOT A LEGISLATED COMMENCEMENT DATE. The page does date the 18% PIT on passive income ('starting from 1 January 2016'), but this entry declares the PIT and the levy as a pair and no source in hand dates the 5% levy, so the pair is dated by the page's own 'Last reviewed - 30 June 2026' — the earliest date at which the citation attests both together. An earlier entry needs a citation for both rates, not an inference from one."
  kind           = "tax_rule"
  source         = "https://taxsummaries.pwc.com/ukraine/individual/income-determination (page states 'Last reviewed - 30 June 2026'; listed in SIMULATOR_SPEC.md §12, retrieved 2026-08-21) — corroborated by https://yankiv.com/opodatkuvannya-investytsiy-ukraina-pdfo-vijskovyj-zbir-ovdp/"
  retrieved_on   = "2026-08-21"
  verified_on    = ""
