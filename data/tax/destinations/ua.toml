  source        = "https://factor.academy/blog/fop-otrimu-koshti-na-rahunok-v-inozemnomu-banku/ (10.03.2024) — «кошти, отримані у валюті на рахунок, відкритий за кордоном, слід оподатковувати за тими правилами, що і доходи, отримані на рахунки, відкриті в українських банках у валюті… на дату надходження валюти слід кількість отриманої валюти помножити на курс НБУ… сплатити податок (2/3/5 %)», noting «в законодавстві України не існує і прямої заборони на отримання ФОП доходів на іноземний банківський рахунок, навіть для єдиноподатників». It rests on ІПК від 21.01.2022 № 100/ІПК/99-00-04-03-03-06 (https://ipk.vobu.ua/view/25359-100-IPK-99-00-04-03-03-06), which answers a ФОП of the third group asking about «дохід від своєї діяльності за договором про надання послуг, укладеним з нерезидентом» credited to «рахунок в іноземному банку» — but which does NOT state this position: reading its silence as the earlier position is factor's inference, recorded on the row's grounds."
