[[destination]]
scheme          = "ua_fop_group_3_non_vat"
venue           = "payoneer"
verdict         = "unsettled"
grounds         = "The source addresses this destination, which is why there is a switch at all — and it numbers nothing on the side a charge would rest on, which is why no reading here may be the tax owed. The ДПС position is reported as living «у своїх роз'ясненнях та індивідуальних податкових консультаціях (ІПК)» with NO NUMBER GIVEN for any of them. The article does cite «Положення … №5» by number, but for the НБУ COUNTER-reading; a number on the other side of a disagreement does not make this side checkable. The source is about Payoneer and nothing wider: «закордонн», «Wise», «за кордоном» and «рахунок за межами» appear zero times, and its argument turns on ДПС «визнає Payoneer небанківською установою» — which by construction says nothing about a foreign BANK, whose row is separate and rests on its own documents."
resolution_path = "An індивідуальна податкова консультація (ст. 52 ПКУ) of the owner's own. Worth following first: лист ДПСУ № 5064/Г, retrieved for the foreign-bank row below, states the same repatriation condition for a foreign BANK account, and whether it reaches a non-bank payment system is exactly what ДПС distinguishes when it calls Payoneer a «небанківська установа»."
kind            = "tax_rule"
source          = "https://yankiv.com/dps-protiv-nbu-payoneer-fop-2025/ (29.09.2025) — «датою отримання доходу ФОП є дата зарахування коштів на рахунок у системі Payoneer, а не на банківський рахунок в Україні», conditioned on «щоб ці кошти вважалися доходом підприємця, їх необхідно перерахувати на український банківський рахунок ФОП (у форматі IBAN) до кінця звітного періоду», failing which «вони оподатковуються як дохід фізичної особи за значно вищими ставками: 18% ПДФО та 5% військового збору». Accessed 2026-08-24, re-fetched 2026-08-25."
retrieved_on    = "2026-08-25"
verified_on     = ""

