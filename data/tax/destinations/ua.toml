# Where the owner's ФОП income is credited, and what each destination is worth.
#
# ---------------------------------------------------------------------------
# THIS TABLE IS NORMATIVE, AND IT IS EXPECTED TO MOVE
# ---------------------------------------------------------------------------
#
# Deciding whether a source's proposition *reaches* a destination is a judgement, not a
# derivation. Every row therefore carries the judgement that put it there, in `grounds`, and
# a destination this file has no row for is **refused** rather than reasoned about.
#
# These verdicts are the least settled thing in feature 012. They rest on administrative
# positions rather than statute — practitioner reports of ДПС consultations, and
# consultations that bind only the taxpayer who asked for them (п. 52.2 ст. 52 ПКУ). Three of
# them moved while the specification was being written. **What closes one is an індивідуальна
# податкова консультація of the owner's own**, which is his action and not a research task:
# `specs/012-fop-group-3/spec.md`'s owner verification task 6.
#
# Moving one is deliberately cheap and that is the design: a verdict is a declared word here,
# every reading computes from a declared scheme, and no destination or component name reaches
# the engine. A change is a row here, a row in the register beside the spec's table, and a
# line in task 6 — never a source-code change.
#
# **The history of a verdict is not written here.** It lives once, in the register beside the
# normative table in `specs/012-fop-group-3/spec.md`. Five review rounds found stale verdict
# history in five different places because a verdict that moved needed five edits; a copy in
# this header would be the sixth.
#
# ---------------------------------------------------------------------------
# WHAT A READING IS, AND WHAT A DATE NAME IS
# ---------------------------------------------------------------------------
#
# A reading either names a declared scheme and the **name** of the date it recognises income
# on, or states why it cannot be computed. The date names used below are `credited` — the
# date funds reach the destination — and `repatriated` — the date they reach a ФОП account at
# a bank in Ukraine. They are strings a caller supplies dates for; nothing in the engine
# compares against either.

# ---------------------------------------------------------------------------
# The ФОП's own foreign-currency account at a bank in Ukraine — INTERPRETED
# ---------------------------------------------------------------------------

[[destination]]
scheme          = "ua_fop_group_3_non_vat"
venue           = "fop"
verdict         = "interpreted"
grounds         = "The guidance answers this destination one inference deep from provisions a reader can go and check — п. 292.6 ПКУ (the date of income is the date of crediting) and п. 292.5 ПКУ (foreign-currency income converts at the official NBU rate on the date of income) — and cites no ДПС consultation. INTERPRETED rather than SETTLED because it is an inference from statute rather than a statement of it. THE VERDICT IS DELIBERATELY NARROWED to an account at a bank IN UKRAINE: neither cited source states where the bank is, and reading 'Ukrainian' into that silence would be an unmarked inference. The narrowing makes the confident claim smaller rather than larger; everything the guidance may or may not cover falls to the foreign-bank row below, where the answer is a switch rather than a charge. This is also the row FR-024a sharpens: the owner's income is ROUTED through Deel, which this row does not cover, and CREDITED here, which it does."
resolution_path = "Nothing is needed for the owner's own case as declared. A ДПС consultation would raise it from INTERPRETED to a numbered position, but the reading is computable and citable as it stands."
kind            = "tax_rule"
source          = "https://id-legalgroup.com/blog/vidobrazhennia-dokhodu-fopom-3-hrupy-otrymanoho-vid-nerezydenta-v-inozemnij-valiuti-viacheslav-komornyj-podatkovyj-konsultant-id-legal-group/ (ФОП group 3 income from a non-resident in foreign currency; cites п. 292.5, п. 292.6 and п. 291.4 ст. 291 ПКУ and references no ДПС consultation) and https://factor.academy/blog/deklaraciya-fop-3-grupi-za-1-kvartal-2025-inozemnij-valyutnij-doxid/ — «дата отримання доходу платника ЄП = дата надходження коштів такому платнику у грошовій (готівковій або безготівковій) формі» and «дохід в іноземній валюті перераховується у гривні за офіційним курсом гривні до інвалюти, встановленим НБУ на дату отримання такого доходу», describing a «валютний рахунок ФОП». Accessed 2026-08-23, re-read 2026-08-24 and 2026-08-25."
retrieved_on    = "2026-08-25"
verified_on     = ""

  [[destination.reading]]
  id            = "fop_scheme_at_the_credit_date"
  label         = "The ФОП scheme, income recognised on the date the funds are credited"
  scheme        = "ua_fop_group_3_non_vat"
  recognised_on = "credited"
  kind          = "tax_rule"
  source        = "п. 292.6 ПКУ (the date of income is the date of crediting) and п. 292.5 ПКУ (foreign-currency income at the official NBU rate on the date of income), as cited and applied by id-legalgroup and factor.academy above. The base is the WHOLE credited amount: the bank commission is not deducted, because the guidance reads the income as the whole invoice amount including it (id-legalgroup, citing п. 292.5, п. 292.6 and п. 291.4 ст. 291 ПКУ). Every other candidate deduction is an absence recorded rather than a modelled zero — owner verification task 3."
  retrieved_on  = "2026-08-25"
  verified_on   = ""

