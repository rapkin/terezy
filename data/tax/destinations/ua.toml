# A bank account outside Ukraine — UNSETTLED, two readings
# ---------------------------------------------------------------------------

[[destination]]
scheme          = "ua_fop_group_3_non_vat"
venue           = "foreign_bank_usd"
verdict         = "unsettled"
grounds         = "The only row here whose readings rest on ДПС documents this project has RETRIEVED AND READ rather than seen reported — and it is UNSETTLED for exactly that reason: the two documents point different ways, and neither binds this owner. An ІПК binds nobody but the taxpayer who asked for it — «індивідуальна податкова консультація має індивідуальний характер і може використовуватися виключно платником податків, якому надано таку консультацію» (п. 52.2 ст. 52 ПКУ, quoted from ІПК № 100/ІПК itself) — and a лист in reply to one person's звернення binds this owner no more. THE TWO READINGS ARE NOT SYMMETRICALLY SUPPORTED, and saying so is the point of retrieving the documents: № 5064/Г states its proposition in terms, while ІПК № 100/ІПК does NOT — asked squarely whether such income bears ПДФО, ВЗ and ЄСВ, it recites the єдиний-податок machinery and concludes only that a ФОП «можуть здійснювати зовнішньоекономічну діяльність за умови дотримання вимог розділу XIV Кодексу», and reading that silence as the earlier position is factor.academy's inference rather than the document's words. A third document factor.academy cited for the personal-income position, ІПК № 177/ІПК/99-00-04-01-04-06 від 27.01.2023, was retrieved and is a consultation for a Товариство «щодо сплати земельного податку»: it is struck, and the personal-income reading rests on № 5064/Г alone."
resolution_path = "An індивідуальна податкова консультація (ст. 52 ПКУ) of the owner's own. Here two ДПС documents were retrieved and they point different ways, so what is needed is not a first number but one addressed to him."
kind            = "tax_rule"
source          = "Лист ДПСУ від 04.07.2022 № 5064/Г/99-00-24-03-03-09 «Щодо оподаткування зарубіжних доходів ФОП» (https://document.vobu.ua/doc/14135) and ІПК від 21.01.2022 № 100/ІПК/99-00-04-03-03-06 (https://ipk.vobu.ua/view/25359-100-IPK-99-00-04-03-03-06), both retrieved in full 2026-08-27 from the public ІПК register at https://ipk.vobu.ua/ and its companion document archive. The practitioner articles that led to them: https://factor.academy/blog/fop-otrimu-koshti-na-rahunok-v-inozemnomu-banku/ (10.03.2024) and https://bip.net.ua/articles/fop-otrimuye-dohid-na-rahunok-v-inozemnomu-banku/. The ДПС's own page on the question (zp.tax.gov.ua/media-ark/news-ark/708956.html) returns HTTP 403 to automated retrieval, so nothing rests on it."
retrieved_on    = "2026-08-27"
verified_on     = ""

