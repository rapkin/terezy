# A crypto-exchange account — UNSETTLED, one reading
# ---------------------------------------------------------------------------

[[destination]]
scheme          = "ua_fop_group_3_non_vat"
venue           = "coinbase"
verdict         = "unsettled"
grounds         = "The source's QUESTION is this destination in as many words, and its answer excludes the ФОП scheme: «Чи включається до доходу ФОП кошти отримані підприємцем за надані послуги на рахунок відкритий на платформі Binance?» — «Ні, не включаються … А оплата за послуги у криптовалюті не є доходом ФОП, а є доходом фізособи.» So there is nothing to contest and the switch holds one figure. It numbers nothing ON THE DESTINATION PROPOSITION: its three citations attach elsewhere — ЗІР 107.01.02 to selling crypto, ЗІР 104.08 to the general system's crypto bookkeeping, п. 168.2.1 / ЗІР 103.02 to the general declare-and-pay duty — and a number on a neighbouring proposition does not make this one checkable. THE ANSWER'S ACCOUNT-LOCATION LIMB IS DELIBERATELY NOT EXTENDED to the payment-system or foreign-bank rows: its own chain runs entirely through crypto, that limb carries no citation of its own, and better-attested material points the other way at the foreign-bank row."
resolution_path = "An індивідуальна податкова консультація (ст. 52 ПКУ) of the owner's own."
kind            = "tax_rule"
source          = "https://7eminar.ua/news/4193-ci-je-doxodom-fopa-kosti-u-viglyadi-kriptovalyuti (23.01.2025), an editorial Q&A. Retrieved 2026-08-27."
retrieved_on    = "2026-08-27"
verified_on     = ""

  [[destination.reading]]
  id            = "personal_income_at_a_crypto_exchange"
  label         = "Personal income — the ФОП scheme is excluded here rather than contested"
  scheme        = "ua_personal_income"
  recognised_on = "credited"
  kind          = "tax_rule"
  source        = "https://7eminar.ua/news/4193-ci-je-doxodom-fopa-kosti-u-viglyadi-kriptovalyuti — «Тому, такий ФОП повинен включити такі кошти до оподаткованого доходу фізособи і сплатити з такого доходу ПДФО та ВЗ.» The rates are the one declaration in data/tax/schemes/ua_personal_income.toml, consumed here and not copied. What is modelled is contract income in DOLLARS credited to an account at the exchange — data/routes/deel_to_coinbase.toml declares the leg USD → USD — so the four sources this feature cites about a ФОП settling IN crypto do not reach it, and the загальна система at the 15% penalty rate is that consequence and therefore not a candidate."
