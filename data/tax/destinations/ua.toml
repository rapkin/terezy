  departs_from_source = "The source computes this reading's base as «гривнева сума, що надійшла на рахунок за курсом банку на момент зарахування» — the BANK's rate. This system computes it at the OFFICIAL rate for this reading's own date instead, per п. 292.5. A channel rate in a tax base is categorically forbidden (011 FR-013) and the three currency roles exist to keep exactly that apart; the article's shortcut is a practitioner's convenience. The divergence is declared here rather than silently absorbed."
