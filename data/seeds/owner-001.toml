# The owner holds nothing. An empty lot list is an ordinary state, not a missing declaration:
# his real figures are unstated (`SIMULATOR_SPEC.md` §11 item 3) and will land here when they
# arrive. An invented lot would have to name an invented instrument, and those do not ship
# (rule 5 of `data/README.md`), so the ones a test needs live in `tests/fixtures/data/seeds/`
# beside the instruments they hold.
#
# **Per-owner data, not curated.** Beside `data/streams/`, `data/spendable/` and
# `data/composition/`, on the boundary Principle VII draws: instruments, routes and tax packs
# are shared public facts about the world, while what this person holds is his life. Putting
# both in one directory would make the boundary a matter of reading field names.
#
# **NO CITATION KEYS, and their absence is the design.** What the owner paid for a lot is his
# own record, not an observation of the world — there is nothing for a source to vouch for.
# It is the same exemption `objectives`, `strategies`, `streams` and `spendable` already
# carry, and `scripts/check_provenance.py` names this directory in `EXEMPT_DIRS` with that
# reason written out. If a *market value* ever has to live here it moves to a sourced
# directory rather than the exemption widening to cover it.
#
# **`is_synthetic = true` is a claim the tool can read**, not decoration beside a header.
# `data/README.md` rule 5 is what permits an invented lot in the repository at all; the day
# one describes something the owner actually holds, the flag says so and the file stops being
# committable.
#
# **A seed is a cost, never a current value** (§4.8). "I hold 100 units worth X today" cannot
# produce a disposal gain at all: the tax engine needs lots, and a lot is units acquired on a
# date at a price. Where the price is genuinely forgotten, `basis = "estimated"` says so and
# the estimate marks every figure derived from it — the gain, the tax on it, and everything
# containing either.
#
# **`cost` is in the base currency, always** (008 FR-010). There is deliberately no
# `currency` key: converting a foreign-currency basis needs a rate on the acquisition date,
# which arrives with the FX features, and an assumed rate under a tax figure is exactly the
# confident wrongness this project exists to remove.

# Stated, not omitted, and ABOVE `[owner]` because a bare key after a table header joins that
# table. The key is required and nothing is substituted for a missing one (008 FR-016), so an
# absent `seed` is a file that does not load rather than a person who holds nothing -- and
# those are different claims.
seed = []

[owner]
id = "owner-001"
