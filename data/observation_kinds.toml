# How fast each kind of observed value goes stale. One threshold per kind, declared once.
#
# FR-028: the staleness threshold is **per kind of value**, and there is **no permissive
# default** — a kind without `staleness_days` fails at load, and so does a sourced table
# naming a kind that is not declared here. research.md D9 is the argument: one
# project-wide threshold would either warn constantly on published fee schedules or stay
# silent on peer-to-peer premiums, and a staleness warning that is usually wrong is one
# that gets ignored, which is worse than none.
#
# These thresholds are **policy, not observation**. They are the owner's statement about
# how long he is willing to trust a number of each kind, so they carry no citation and no
# `verified_on` — there is nothing to verify a review interval against. Everything that
# does carry a citation names one of these kinds, and `scripts/check_provenance.py`
# refuses a sourced table naming a kind this file does not declare.
#
# The engine never evaluates staleness from a clock: `core.primitives.staleness` measures
# `as_of − the later of verified_on and retrieved_on` against the threshold below, with
# `as_of` an input to the run (research.md D12).

[[kind]]
id             = "p2p_premium"
staleness_days = 7
note           = "A peer-to-peer premium moves with demand and can shift within a week."

[[kind]]
id             = "bank_fee_schedule"
staleness_days = 365
note           = "A published tariff changes on the bank's own schedule, rarely mid-year."

[[kind]]
id             = "regulatory_limit"
staleness_days = 180
note           = "NBU limits change by decision, not by drift; six months is a review prompt."

[[kind]]
id             = "bond_terms"
staleness_days = 365
note           = "A bond's contractual terms do not drift, but the reading of them can be wrong or superseded by a new issue; a yearly re-read is the review prompt. Feature 001's declarations name this kind."

[[kind]]
id             = "tax_rule"
staleness_days = 180
note           = "A tax rule changes by legislation, not by drift, and a change is retroactive to a date rather than gradual; six months matches the regulatory-limit prompt because both are read off a published text."

[[kind]]
id             = "venue_terms"
staleness_days = 365
note           = "A venue's published minimum ticket or lot size changes on the venue's own schedule, like a tariff. Declared separately from bank_fee_schedule because a minimum ticket is a condition of dealing rather than a price, and the two are read off different pages."

[[kind]]
id             = "fund_terms"
staleness_days = 365
note           = "A collective-investment fund's contractual terms — minimum ticket, term end, subscription cutoff, the spread around NAV, the leases' capped peg — are read off a регламент or проспект that is amended on the manager's own schedule. Like bond_terms, they do not drift, but a new redaction supersedes them, so a yearly re-read is the review prompt. Feature 006's fund declarations name this kind."

[[kind]]
id             = "fund_stated_yield"
staleness_days = 180
note           = "A rate the fund states about itself — a target, or a range — is a claim the fund may restate at any time, and it is the single figure a reader is most likely to believe without checking. Half the fund_terms interval, because the terms are contractual and the stated yield is not."

[[kind]]
id             = "fund_liquidity"
staleness_days = 30
note           = "A buyback the manager performs by current practice rather than by obligation can be withdrawn the day it becomes expensive. Thirty days is the shortest prompt in this file after a peer-to-peer premium, because what ages here is not a price but a permission."

[[kind]]
id             = "cpi_index"
staleness_days = 45
note           = "A published price index for a month that has ended is a historical fact and does not decay -- what ages here is the RETRIEVAL, because the publisher adds a month roughly every month and a series fetched long ago is a series missing its recent end. Forty-five days is the re-fetch prompt, not a claim that an old month's value went wrong. Whether a series is complete up to a given date is a different question entirely, answered from its coverage window rather than from this threshold, and the deflation feature owns it."

[[kind]]
id             = "official_rate"
staleness_days = 7
note           = "An official rate published for a date that has passed is a historical fact and does not decay -- what ages here is the RETRIEVAL, exactly as for cpi_index, and the publisher adds a rate every working day rather than a value every month. Seven days is the re-fetch prompt for a daily series: a series fetched a month ago is a month short of its own end, and a tax base is struck on a specific date rather than over a window, so the missing end is not a smaller error than a missing month. Its own kind rather than tax_rule, because a legal RATE changes by legislation and prompts a re-read, while a rate SERIES goes out of date by standing still."
