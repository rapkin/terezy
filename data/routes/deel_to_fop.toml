# Deel → ФОП account, in dollars. The owner's actual configuration today.
#
# **This route and `deel_to_coinbase.toml` are the same decision, declared twice.** What the
# owner changes in the Deel cabinet is which of them is in force, and that is precisely the
# `funding route in` term of the tuple — so the choice he makes in someone else's web form is
# the choice this engine ranks. Nothing about that comparison is special-cased: they are two
# declarations and the comparison is 002's.
#
# SYNTHETIC FIXTURE for every number. Deel's payout fee for this corridor is unobserved.

[route]
id            = "deel_to_fop"
provider      = "Deel"
origin        = "deel"
destination   = "fop"
direction     = "inbound"
partner_route = "fop_usd_to_monobank_uah"
status        = "open"

  [[route.leg]]
  index                  = 0
  kind                   = "transfer"
  from_venue             = "deel"
  to_venue               = "fop"
  from_ccy               = "USD"
  to_ccy                 = "USD"
  fee_pct                = 0.0
  fee_fixed              = 0.0
  latency_days           = 2
  disruption_probability = 0.01
  kind_of_observation    = "bank_fee_schedule"
  source                 = "SYNTHETIC FIXTURE — invented. Declared free and two days so the corridor exists and can be compared; the owner has not yet observed Deel's payout fee or settlement time to a Ukrainian ФОП account."
  retrieved_on           = "2026-08-23"
  verified_on            = ""
